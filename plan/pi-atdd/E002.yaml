    purpose: No convention skipped after guidance clipping
    phase: GREEN
  harness:
    type: unit
    category: backend
    language_hint: typescript
  given:
    abstract:
    - multiple relevant conventions exceed the Pi context budget
  when:
    abstract: Pi delivers a pre-edit guidance page and the agent retries the edit
    action: invoke
    target: piAtdd
  then:
    abstract:
    - the edit remains blocked until every applicable convention has actually been rendered and omitted rules remain pending
    assertions:
    - type: equals
      target: regression outcome acc:pi-atdd:E003-UNIT-201
      value: true
  signal: {}
  metadata:
    capability: pi-atdd
    feature: deliver-guidance
- identity:
    urn: acc:pi-atdd:E003-UNIT-204
