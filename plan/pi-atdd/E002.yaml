    purpose: Physical project containment before Pi edits
    phase: GREEN
  harness:
    type: unit
    category: backend
    language_hint: typescript
  given:
    abstract:
    - a path looks inside the workspace but an existing parent or target is a symlink to an external location
  when:
    abstract: Pi handles an edit or write request, including a retry
    action: invoke
    target: piAtdd
  then:
    abstract:
