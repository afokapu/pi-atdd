urn: desired-outcome:pi-atdd:E010
feature: exclude-personal-mcp
statement: Worker and reviewer launches exclude personal MCP tools while coach launches preserve all tools, with runtime effects reported.
acceptances:
- identity:
    urn: acc:pi-atdd:atd-58-a01
    id: AC-UNIT-900
    purpose: Worker and reviewer launch plans include the personal MCP tool exclusion
    phase: GREEN
  harness:
    type: unit
    category: backend
    language_hint: typescript
  given:
    abstract: [a valid worker or reviewer launch request]
  when:
    abstract: the launch plan is built
    action: invoke
    target: planLaunch
  then:
    abstract: [pi arguments include --exclude-tools with the Wispr, Granola, and Google Workspace patterns]
    assertions: [{type: equals, target: 'acceptance acc:pi-atdd:atd-58-a01 proof result', value: true}]
  signal: {}
  metadata: {capability: pi-atdd, feature: exclude-personal-mcp}
- identity:
    urn: acc:pi-atdd:atd-58-a02
    id: AC-UNIT-901
    purpose: Coach launch plans do not exclude tools
    phase: GREEN
  harness:
    type: unit
    category: backend
    language_hint: typescript
  given:
    abstract: [a valid coach launch request]
  when:
    abstract: the launch plan is built
    action: invoke
    target: planLaunch
  then:
    abstract: [pi arguments contain no tool exclusion]
    assertions: [{type: equals, target: 'acceptance acc:pi-atdd:atd-58-a02 proof result', value: true}]
  signal: {}
  metadata: {capability: pi-atdd, feature: exclude-personal-mcp}
- identity:
    urn: acc:pi-atdd:atd-58-a03
    id: AC-UNIT-902
    purpose: Dry-run output shows tool exclusions for worker and reviewer only
    phase: GREEN
  harness:
    type: unit
    category: backend
    language_hint: typescript
  given:
    abstract: [a valid dry-run request for each governed role]
  when:
    abstract: the launcher prints its plan
    action: invoke
    target: runLaunch
  then:
    abstract: [worker and reviewer dry runs show the exclusion and coach dry run does not]
    assertions: [{type: equals, target: 'acceptance acc:pi-atdd:atd-58-a03 proof result', value: true}]
  signal: {}
  metadata: {capability: pi-atdd, feature: exclude-personal-mcp}
- identity:
    urn: acc:pi-atdd:atd-58-a04
    id: AC-UNIT-903
    purpose: A real launch investigation reports MCP connection behavior and Wispr reload warnings
    phase: GREEN
  harness:
    type: integration
    category: backend
    language_hint: typescript
  given:
    abstract: [a worker launched with the personal MCP tool exclusion in a throwaway agent directory]
  when:
    abstract: Pi starts and reloads its MCP configuration
    action: query
    target: pi
  then:
    abstract: [the report records whether connections still open and whether Wispr 429 warnings stop]
    assertions: [{type: equals, target: 'acceptance acc:pi-atdd:atd-58-a04 proof result', value: true}]
  signal: {}
  metadata: {capability: pi-atdd, feature: exclude-personal-mcp}
