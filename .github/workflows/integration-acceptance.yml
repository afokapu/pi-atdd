name: ATD-39 original-issue acceptance intake

on:
  pull_request:
    branches:
      - integration/atd-39-ooc-activation
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  original-issue-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out coordinator-controlled integration base
        uses: actions/checkout@v4
        with:
          # Pull-request events can retain a stale base SHA after coordinator commits.
          # Read only the protected coordinator-owned integration branch, never PR head code.
          ref: refs/heads/integration/atd-39-ooc-activation
          fetch-depth: 0
          persist-credentials: false
      - name: Verify intake checker logic
        run: node --test tests/integration-contract-check.test.mjs
      - name: Verify branch provenance against its scoped fork
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$PR_HEAD_REF" in
            feature/atd-40-ooc-governance-contract|feature/atd-41-structural-activation|feature/atd-39-reconcile-trusted-phase)
              FORK=54edcf0cda4b435bb3b6dd1e9c4ea368baf3cc85 ;;
            sync/atd-39-main-3007c139)
              # Coordinator sync preserves the pinned upstream main revision.
              FORK=3007c13958def5879106c4612f10bef8d524e9db ;;
            feature/atd-42-trusted-phase-activation)
              # ATD-42 was a separate main-based issue, not an ATD-39 worker fork.
              FORK=9abc1a087db8d3d50f4e7badbd0320fe68733ca1 ;;
            feature/atd-22-observer-acceptance-followup)
              # ATD-22 completion follows staged ATD-41 from this exact integration commit.
              # Only this source-issue branch is admitted for original OBS-001..004 intake.
              FORK=567b2e513782b380c18f320d69edf140d61a36d4 ;;
            feature/atd-39-register-atd-22-followup)
              # Coordinator-owned admission patch, from the exact reviewed fork.
              FORK=9792560103f1a13f34bf8a3f1620342c04158616 ;;
            *) echo "Unregistered integration head: $PR_HEAD_REF"; exit 1 ;;
          esac
          git fetch --no-tags origin "$PR_HEAD_SHA"
          git merge-base --is-ancestor "$FORK" "$PR_HEAD_SHA"
      - name: Inspect original-issue acceptance dispositions
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-integration-contract.mjs
