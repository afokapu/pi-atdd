name: pi-atdd checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke:pi
