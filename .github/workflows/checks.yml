name: pi-atdd checks
on:
  pull_request:
  push:
    branches: [main, integration/atd-39-ooc-activation] # ATD-39: verify combined integration head on every merge
permissions:
  contents: read
  packages: read
jobs:
  typescript-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: '@forgeonehundred'
      # A private cross-owner package requires a granted read:packages token.
      # Never commit credentials; T9_PACKAGES_READ_TOKEN is a repository secret.
      - run: npm install --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.T9_PACKAGES_READ_TOKEN || github.token }}
      - run: npm run check
      - run: node --input-type=module -e "import('@forgeonehundred/frg-t9-semantic-compiler').then(m => { if(typeof m.createT9 !== 'function') process.exit(1) })"
      - uses: actions/checkout@v4
        with:
          repository: afokapu/atdd-bun
          ref: 5945d97e18310e7c862c08e73985400935d21346
          path: .cache-sources/atdd-bun
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: afokapu/atdd-flow
          ref: 2a66019a5ecf2b7a9f999ebfa04d04c9f548f19a
          path: .cache-sources/atdd-flow
          persist-credentials: false
      - run: npm run smoke:catalog
      # Evidence only: reuse pinned metrics on this Node/Pi change; no merge authority.
      - run: node tools/atd-41-quality-audit.mjs
      # Complete canonical inventory, no fabricated applicability or approval.
      - run: node tools/atd-41-rule-ledger.mjs
      - run: npm run smoke:pi
      - run: npm run smoke:attention
      - run: npm run smoke:install
  tracker-issue:
    # ATD-24: non-blocking until open PRs carry an issue id. Exit 3 (no tracker configured) is a notice, never a pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: '@forgeonehundred'
      # A private cross-owner package requires a granted read:packages token.
      # Never commit credentials; T9_PACKAGES_READ_TOKEN is a repository secret.
      - run: npm install --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.T9_PACKAGES_READ_TOKEN || github.token }}
      - run: bash scripts/tracker-check-ci.sh
        env:
          TRACKER_BASE_REF: origin/${{ github.base_ref }}
          TRACKER_HEAD_REF: ${{ github.event.pull_request.head.sha }}
          TRACKER_BRANCH: ${{ github.head_ref }}
          TRACKER_PR_BODY: ${{ github.event.pull_request.body }}
