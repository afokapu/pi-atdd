name: pi-atdd checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/checkout@v4
        with:
          repository: afokapu/atdd-bun
          ref: 5945d97e18310e7c862c08e73985400935d21346
          path: .cache-sources/atdd-bun
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: afokapu/atdd-flow
          ref: 2a66019a5ecf2b7a9f999ebfa04d04c9f548f19a
          path: .cache-sources/atdd-flow
          persist-credentials: false
      - run: npm run smoke:catalog
      - run: npm run smoke:pi
