name: pi-atdd checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: jj-cli@0.46.0
      - run: npm run smoke:jj-handoff
      - run: node --experimental-strip-types tests/delivery-gate-smoke.ts
      - run: npm run check
      - run: npm run smoke:attention-lock
  tracker-issue:
    # ATD-24: non-blocking until open PRs carry an issue id. Exit 3 (no tracker configured) is a notice, never a pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: bash scripts/tracker-check-ci.sh
        env:
          TRACKER_BASE_REF: origin/${{ github.base_ref }}
          TRACKER_HEAD_REF: ${{ github.event.pull_request.head.sha }}
          TRACKER_BRANCH: ${{ github.head_ref }}
          TRACKER_PR_BODY: ${{ github.event.pull_request.body }}
