# Legacy-vocabulary mapping table (PLT-103). Source: the owner-approved dry run v6 (scripts/vocab6.py, 2026-11-19).
# One legacy form maps to one new form per surface. The migration tool, the aliases and agents read this file.
# Owner decisions: 2026-11-19 (terms, naming rule, hyphen prose head); 2026-11-20 (apply scope: sidecar frozen).
schema: pi-atdd/legacy-terms/v1
status: approved
owner_approved_terms: 2026-11-19
sunset:
  rule: 60 days after the release that ships this change
  date: null  # set at release by the owner
  until_date: advisory  # a legacy term is a warning
  after_date: strict
naming_rule: >
  prose uses the full term; identifiers, URN schemes and folders use the short head noun;
  <Thing>Runner runs what <Thing>Router picks; desired-outcome: is the exception (outcome: is a journey terminal field).
  Bare flow is never an identifier. Compounds keep FlowRunner, FlowRouter, FlowRouterRunner, FlowVariables.
  Code spans and code blocks take the code form. Prose is lowercase mid-sentence.
  A plain hyphenated prose word takes the lowercase prose head (wagon-agnostic -> capability-agnostic).
terms:
  - concept: wagon
    prose: {legacy: "wagon / wagons", replacement: "product capability / product capabilities"}
    identifier: {legacy: "wagon, wagons", replacement: "capability, capabilities"}
    urn_scheme: {legacy: "wagon:", replacement: "capability:"}
    folder: {legacy: "src/wagons/, plan/<wagon>/", replacement: "src/capabilities/, plan/<capability>/"}
    field_key: {legacy: "wagon:, wagon_id", replacement: "capability:, capability_id"}
    alias: required
  - concept: train
    prose: {legacy: "train / trains", replacement: "user/system flow / user/system flows"}
    identifier: {legacy: "train, trains, trainId, train_id", replacement: "UserSystemFlow, userSystemFlow, user_system_flow (plural: user-system-flows)"}
    compound_head: {legacy: "TrainRunner", replacement: "FlowRunner (the head Flow is kept by owner decision)"}
    urn_scheme: {legacy: "train:", replacement: "user-system-flow:"}
    folder: {legacy: "plan/_trains/", replacement: "plan/_user-system-flows/"}
    field_key: {legacy: "train_id, trains:", replacement: "user_system_flow_id, user-system-flows:"}
    alias: required
  - concept: interlocking
    prose: {legacy: "interlocking / interlockings", replacement: "flow router / flow routers"}
    identifier: {legacy: "interlocking, InterlockingRunner", replacement: "FlowRouter, flow-router, FlowRouterRunner"}
    urn_scheme: {legacy: "interlocking:", replacement: "flow-router:"}
    folder: {legacy: "plan/_trains/_interlockings/", replacement: "plan/_user-system-flows/_flow-routers/"}
    field_key: {legacy: "interlocking_id", replacement: "flow_router_id"}
    alias: required
  - concept: cargo
    prose: {legacy: "Cargo / cargo (mass noun)", replacement: "flow variables; flow-variable before a listed word; verb agreement only where Cargo is the subject"}
    identifier: {legacy: "cargo, Cargo", replacement: "flow-variables, FlowVariables, flowVariables"}
    alias: required
  - concept: wmbt
    prose: {legacy: "WMBT / WMBTs", replacement: "desired outcome / desired outcomes"}
    identifier: {legacy: "wmbt, WMBT, wmbts", replacement: "desired-outcome, DesiredOutcome, desired_outcome"}
    urn_scheme: {legacy: "wmbt:", replacement: "desired-outcome:  (exception to the naming rule)"}
    field_key: {legacy: "wmbt:, covers_wmbts", replacement: "desired-outcome:, covers_desired_outcomes"}
    alias: required
  - concept: station-master
    prose: {legacy: "Station Master / station master", replacement: "journey router / journey routers"}
    identifier: {legacy: "station-master, StationMaster", replacement: "journey-router, JourneyRouter"}
    urn_scheme: {legacy: "station-master:", replacement: "journey-router:"}
    folder: {legacy: "station-master/", replacement: "journey-router/"}
    alias: required
  - concept: journey-runner
    status: unchanged (owner table)
    replacement: JourneyRunner
grammar:
  rule: listed per line in grammar_review.md; article rows and approved verb rows are applied in PLT-103.
  forms: [an -> a before a changed term; verb agreement only where Cargo is the grammatical subject]
exceptions:
  - desired-outcome: (not outcome:)
  - JourneyRunner
  - Flow (companion tool) and SourceKind "flow"
  - wagons.dev (external domain)
  - frozen audit records (conventions-sidecar/, conventions/provenance.json, docs/RELEASE-0.2.0.md)
