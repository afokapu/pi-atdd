# Repository configuration for pi-atdd. The tracker is named here, never in code (PLT-96).
# kind: the configured issue tracker (Linear by default for this workspace).
# issuePattern: regular expression for an issue id, e.g. PLT-96; matched case-insensitively.
schema: pi-atdd/config/v2
tracker:
  kind: linear
  issuePattern: '[A-Z][A-Z0-9]{1,9}-\d+'
