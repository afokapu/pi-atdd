[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-atdd-kernel"
version = "0.1.0"
description = "Standalone convention graph and Python-first ATDD verification for Pi"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pi-atdd = "pi_atdd.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
