# PLT-100: relationships for the package-authored Coach conventions and their existing neighbours.
# Every node below must match a rule_id in catalog/pi-atdd/conventions/**.
schema_version: 1.0.0
nodes:
  - shared.convention.propose
  - coach.naming.instance-label
  - coach.policy.action-tiers
  - coach.policy.unclear-risk-higher-tier
  - coach.policy.trivial-request
  - coach.policy.decision-log
  - coach.role.orchestrate-not-build
  - shared.model.tier-by-role
  - shared.model.names-only-tiers
  - shared.model.escalate-after-two-failures
  - shared.model.subscription-providers
  - coder.tracker.issue-in-branch-and-pr
  - planner.tracker.issue-before-ratify
  - shared.tracker.issue-mandatory
  - shared.tracker.unconfigured-notice
edges:
  - source_ref: coach.policy.action-tiers
    target_ref: coach.collaboration.accountable-delegation
    type: requires
    constraint: mandatory
    control: internal
    reason: "The tiers apply the delegation and escalation policy: only main executes a merge, and the operator never merges."
  - source_ref: coach.policy.action-tiers
    target_ref: shared.convention.propose
    type: requires
    constraint: conditional
    control: internal
    reason: "A convention change is an act-then-report item and goes through the proposal path, never by editing an active rule."
  - source_ref: coach.policy.unclear-risk-higher-tier
    target_ref: coach.policy.action-tiers
    type: requires
    constraint: mandatory
    control: internal
    reason: "The higher-tier rule only has meaning relative to the four tiers."
  - source_ref: coach.policy.trivial-request
    target_ref: coach.policy.action-tiers
    type: requires
    constraint: mandatory
    control: internal
    reason: "A trivial request is still placed in a tier; it only skips the owner for act-alone or act-then-report work."
  - source_ref: coach.policy.decision-log
    target_ref: coach.policy.action-tiers
    type: requires
    constraint: mandatory
    control: internal
    reason: "The log is required for the decisions the tiers allow a Coach to take alone."
  - source_ref: coach.role.orchestrate-not-build
    target_ref: coach.policy.action-tiers
    type: requires
    constraint: mandatory
    control: internal
    reason: "The role is applied through the tiers: building is never, and a brief to a worker is act then report."
  - source_ref: coach.role.orchestrate-not-build
    target_ref: coach.collaboration.accountable-delegation
    type: requires
    constraint: mandatory
    control: internal
    reason: "Code is executed by a named worker under delegation; the Coach keeps coordination and checks."

  - source_ref: shared.tracker.issue-mandatory
    target_ref: shared.tracker.unconfigured-notice
    type: runs_alongside
    constraint: discretionary
    control: internal
    reason: when no tracker is configured the notice applies alongside; it is term-selected, not pulled into every edit's page
  - source_ref: coder.tracker.issue-in-branch-and-pr
    target_ref: shared.tracker.issue-mandatory
    type: requires
    constraint: mandatory
    control: internal
    reason: the coder's branch and PR reference is the way the core obligation is met
  - source_ref: planner.tracker.issue-before-ratify
    target_ref: shared.tracker.issue-mandatory
    type: requires
    constraint: mandatory
    control: internal
    reason: the plan's tracker link is the planning-time form of the core obligation
  - source_ref: planner.tracker.issue-before-ratify
    target_ref: planner.plan.confirm-binds-an-issue
    type: requires
    constraint: mandatory
    control: internal
    reason: extends the local binding (PLT-96) with the external tracker issue; does not contradict it
  - source_ref: shared.convention.propose
    target_ref: shared.tracker.issue-mandatory
    type: runs_alongside
    constraint: discretionary
    control: internal
    reason: a catalog change proposed through the governed path is itself code-changing work and needs a tracker issue
