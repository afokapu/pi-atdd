schema_version: 1.1.0
rule_id: coder.tracker.issue-in-branch-and-pr
kind: rule
status: active
name: A coder's branch and pull request carry the tracker issue id and the issue status stays current
statement: >-
  A coder who pushes a branch or opens a pull request for a code change puts the tracker issue id in
  the branch name and in the PR body, and keeps the issue status current: In Progress when the work
  starts, Done when its acceptance is met, and an explicit comment when it is blocked.
terms:
- term_id: branch_reference
  text: >-
    The tracker issue id appears in the branch name, so the branch is traceable from the tracker
    without opening the pull request.
- term_id: pr_reference
  text: >-
    The tracker issue id appears in the PR body, so the review and the tracker point to each other.
- term_id: status_current
  text: >-
    In Progress when work starts, Done when acceptance is met. Work that stops because it is blocked or
    waits on the owner stays In Progress with a comment that says why.
content:
  summary: >-
    The branch name and PR body name the tracker issue, and the issue status is moved as the work moves.
  normative_text: |
    The coder makes the tracker issue visible on the code change: the id is in the branch name and in
    the PR body, and the validator (`atdd tracker check`) fails the change set when either is missing.
    The coder also keeps the issue status current. Status moves are standing approval only where the
    profile grants them; creating, editing or deleting issues or comments still needs the owner's approval.
  fix_hint: |
    For each code-changing branch:
      * name the branch after the tracker issue id (for example `feature/<ID>-short-description`);
      * write the tracker issue id in the PR body;
      * move the issue to In Progress when you start, and to Done when acceptance is met;
      * when blocked, leave it In Progress and comment why.
  exceptions:
  - >-
    A branch that holds no code change (read-only investigation) needs no issue id.
metadata:
  aliases: []
  severity: 3
  disposition: strict
  introduced_in: PLT-96
implementation:
  type: validator
  ref: src/tracker-issue.ts::checkTrackerIssue
