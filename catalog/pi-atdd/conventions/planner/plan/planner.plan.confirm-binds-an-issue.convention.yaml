schema_version: 1.1.0
rule_id: planner.plan.confirm-binds-an-issue
kind: rule
status: active
name: Bind a plan to a tracker issue before ratification
statement: >-
  Before ratifying a plan, bind its decomposition to an issue record in the repository's configured tracker
  (for example, Linear) and record that issue's id on the plan. Every repository modification requires its own
  issue, branch, and worktree. The session removes the up-front ceremony, not the issue.
content:
  summary: >-
    A plan that includes repository modifications is bound to an issue in the configured tracker before
    ratification, and its issue id is recorded on the plan.
  normative_text: >-
    The plan's issue, branch and worktree binding remains required for every repository modification. The tracker
    issue makes the planned work visible before any repository change starts; the session removes the up-front
    ceremony, not the issue.
  fix_hint: >-
    Before ratifying a plan that includes repository modifications, bind its decomposition to an issue in the
    repository's configured tracker and record that issue's id on the plan. Ask the owner before creating an issue.
metadata:
  aliases: []
  severity: 4
  disposition: strict
  introduced_in: ATD-55
implementation:
  type: policy
  ref: pi-atdd neutral replacement for the vendored binding convention
