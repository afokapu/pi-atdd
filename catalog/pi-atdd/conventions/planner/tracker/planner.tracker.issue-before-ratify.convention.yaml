schema_version: 1.1.0
rule_id: planner.tracker.issue-before-ratify
kind: rule
status: active
name: A planner ratifies a plan only when it is bound to an issue in the configured tracker
statement: >-
  Before ratifying a decomposition that includes repository modifications, bind the plan to an issue in the
  repository's configured tracker (planner.plan.confirm-binds-an-issue) and record its id on the plan, so the
  owner sees the planned code work before any repository change starts.
terms:
- term_id: plan_tracker_binding
  text: >-
    The configured tracker issue bound to the plan before ratification, as required by
    planner.plan.confirm-binds-an-issue.
- term_id: tracker_link
  text: >-
    The local issue carries the configured tracker issue id. The planner creates or asks for that issue
    under shared.tracker.issue-mandatory; it never fabricates an id.
content:
  summary: >-
    Before ratifying a plan that includes repository modifications, bind it to an issue in the configured tracker and record that issue's id on the plan.
  normative_text: |
    The issue, branch and worktree rule applies to every repository modification. Before ratification, bind the
    plan to an issue in the configured tracker and record its id on the plan, so the tracker shows the planned
    code work. A plan with no configured tracker is ratified only with the notice from
    shared.tracker.unconfigured-notice, not silently.
  fix_hint: |
    Before ratifying a decomposition that includes code changes:
      * bind the plan to an issue in the configured tracker (planner.plan.confirm-binds-an-issue);
      * create an issue only with the owner's approval, otherwise ask;
      * record the tracker issue id on the plan so the coder can carry it into the branch and PR.
  exceptions:
  - >-
    A plan with no code-changing step needs no tracker link.
metadata:
  aliases: []
  severity: 4
  disposition: strict
  introduced_in: PLT-96
implementation:
  type: validator
  ref: src/tracker-issue.ts::checkTrackerIssue
