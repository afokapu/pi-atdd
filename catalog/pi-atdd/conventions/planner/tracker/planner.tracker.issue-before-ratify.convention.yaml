schema_version: 1.1.0
rule_id: planner.tracker.issue-before-ratify
kind: rule
status: active
name: A planner ratifies a plan only when it is bound to the local issue and to the tracker issue
statement: >-
  A planner extends the local plan binding with the external tracker: before a decomposition is
  ratified, it is bound to a local ATDD issue (planner.plan.confirm-binds-an-issue) and that issue is
  linked to an issue in the configured tracker, so the owner sees the planned code work before any
  repository change starts.
terms:
- term_id: local_binding
  text: >-
    The local ATDD issue record that the plan is authored on, as required by planner.plan.confirm-binds-an-issue.
    It is not the tracker issue, and it does not replace it.
- term_id: tracker_link
  text: >-
    The local issue carries the configured tracker issue id. The planner creates or asks for that issue
    under shared.tracker.issue-mandatory; it never fabricates an id.
content:
  summary: >-
    Ratifying a plan binds it both to the local ATDD issue and to the tracker issue for the code work it plans.
  normative_text: |
    The local binding stays the iron rule (issue, branch and worktree per repository modification). This
    rule adds the external record: the plan's issue must be linked to a tracker issue before ratification,
    so the tracker shows the planned code work. A plan with no configured tracker is ratified only with the
    notice from shared.tracker.unconfigured-notice, not silently.
  fix_hint: |
    Before ratifying a decomposition that includes code changes:
      * bind the plan to the local ATDD issue (planner.plan.confirm-binds-an-issue);
      * link that issue to its tracker issue (create one only with the owner's approval, otherwise ask);
      * record the tracker issue id on the plan so the coder can carry it into the branch and PR.
  exceptions:
  - >-
    A plan with no code-changing step needs no tracker link.
metadata:
  aliases: []
  severity: 4
  disposition: strict
  introduced_in: PLT-96
implementation:
  type: validator
  ref: src/tracker-issue.ts::checkTrackerIssue
