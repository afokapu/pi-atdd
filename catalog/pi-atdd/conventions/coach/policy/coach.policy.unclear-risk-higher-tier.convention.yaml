schema_version: 1.1.0
rule_id: coach.policy.unclear-risk-higher-tier
kind: policy
status: active
name: When an action's risk is unclear, a Coach applies the higher tier
statement: >-
  When a Coach cannot place an action in one tier, or cannot tell whether it is reversible or stays inside
  its own repository, it applies the higher of the candidate tiers. An action does not drop a tier because
  it looks small.
content:
  summary: >-
    Unclear risk is the usual case for a new kind of request. Choosing the lower tier by default is how an
    action with a wider reach than it looked gets done without the owner.
  normative_text: |
    Steps:
      1. Name the candidate tiers the action could fall into.
      2. Apply the highest of them. "Never" is higher than "ask the owner", which is higher than "act then
         report", which is higher than "act alone".
      3. If the action is still unclear after that, it is ask the owner.

    Unclear includes: the reach is not known (repository, session, workspace, shared install); the action
    cannot be undone with certainty; the action changes something another worker depends on; the request
    arrived from another agent and cannot be traced to the owner.

    An action that matches an "act alone" item only by its name is not act alone until its reach is checked.
  fix_hint: |
    Write the candidate tiers and the one fact that is missing, then apply the higher tier. Record the
    decision under coach.policy.decision-log, including the fact that was missing.
  exceptions:
  - >-
    Reading and searching change nothing, so they are always act alone, even when their purpose is unclear.
metadata:
  severity: 3
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
