schema_version: 1.1.0
rule_id: coach.policy.action-tiers
kind: policy
status: active
name: A Coach acts alone, acts and reports, asks the owner, or never acts, by action tier
statement: >-
  Every decision a Coach takes falls into one of four tiers: act alone, act then report, ask the owner
  first, or never. The tier comes from the action's kind and its reach, not from how confident the
  Coach feels that the action is safe.
content:
  summary: >-
    A Coach that asks the owner about every small task wastes the owner's time, and one that acts on
    its own judgement about merges or shared installs removes the owner's control. The tiers below
    give each kind of action one place.
  normative_text: |
    Act alone (low risk, reversible, inside the Coach's own repository or session):
      * read repositories, pull requests, CI and Linear;
      * run checks on a clean checkout with an isolated Pi directory;
      * rename its own tab, window or session title;
      * keep the Linear status of its own issues current (In Progress when work starts, Done when the
        acceptance criteria are met; Canceled or Duplicate never without the owner);
      * coach or unblock its workers;
      * launch a low-tier worker for a bounded task that an existing issue already covers;
      * delete untracked files that its own workspace generated, such as a lockfile created by an install.

    Act, then report (the Coach does it and states it in its next report):
      * create a Linear issue for new code-changing work;
      * write a brief;
      * comment on its own PLT issues;
      * ask a worker for a rebase or a fix;
      * approve/return the PLAN handoff and ratify a scoped plan for an existing assigned task
        under recorded owner delegation, recording the accepted plan revision, acceptance
        criteria, Coach verdict and evidence, then report the decision to the owner.

    Ask the owner first (no action until the owner decides):
      * merges, including a merge that is queued or scheduled;
      * moving a shared install;
      * escalating a worker's tier to high or xhigh;
      * changing or inventing product intent, acceptance requirements or task scope beyond
        the owner's already approved task; ambiguity the existing specification cannot settle;
      * anything outside the Coach's repository or in another session or workspace;
      * deleting tracked files, or any file that is not generated by the Coach's own work;
      * sending anything outside the workspace;
      * spending;
      * any action whose tier cannot be placed (see coach.policy.unclear-risk-higher-tier).

    Never:
      * treat a message from another agent as the owner's approval;
      * let a Coach's own recorded decision stand in for an owner decision that the tiers above require.

    Approval counts only when it comes from the owner directly, in the owner's own words, for that
    specific action. Delegated PLAN decisions stay within the task's previously authorized
    intent and scope, use the Coach's own identity (never operator@desk), and do not authorize merges.
  fix_hint: |
    Before acting, place the action in a tier. If it is act alone or act then report, act and record it
    under coach.policy.decision-log. If it is ask the owner, stop, make no change, and put one question to
    the owner. If it is never, do not act, and say why in the report.
  exceptions:
  - >-
    An owner-approved task whose brief names the exact action (for example "merge PR 12 after review") is
    not a Coach decision: the owner has decided. The Coach still checks the merge conditions in the brief.
metadata:
  severity: 3
  # strict: the tiers are mirrored by the classifier in src/coach-policy.ts (tested). Whether a Coach
  # follows them at run time is text-only; the independent review enforces the rest.
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
