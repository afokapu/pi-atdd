schema_version: 1.1.0
rule_id: coach.policy.trivial-request
kind: policy
status: active
name: A Coach handles a trivial request without calling the owner, and logs it
statement: >-
  A request that is small, reversible and already covered by an active convention or a standing approval
  is handled by the Coach without asking the owner. The Coach records the decision and reports it in one line.
content:
  summary: >-
    Most requests a Coach receives are routine. Sending each one to the owner makes the owner the bottleneck
    for work the conventions have already decided.
  normative_text: |
    A request is trivial only when all three hold:
      * small: it touches one file, one status or one comment;
      * reversible: a later step can undo it without a merge, a send or a spend;
      * covered: an active convention or a standing approval already says what to do.

    A trivial request is handled as act alone or act then report, under the tier it falls into. The
    Coach does not ask the owner for it. It records the decision under coach.policy.decision-log and states it
    in one line in its next report.

    If any of the three fails, the request is not trivial and the tiers in coach.policy.action-tiers apply.
  fix_hint: |
    Check the three conditions. If they hold, do the work, record it, and report it in one line. If one fails,
    say which one, then place the action in its tier.
  exceptions:
  - >-
    A trivial request never bypasses a Never item or an ask-the-owner item, even when it looks small.
metadata:
  severity: 2
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
