schema_version: 1.1.0
rule_id: coach.policy.decision-log
kind: policy
status: active
name: A Coach records every decision it takes alone
statement: >-
  Each decision a Coach takes alone (act alone, or act then report) is written to a decision log with the
  request, the tier, the convention that applies and the evidence, in the same step as the action or before it.
content:
  summary: >-
    A decision that is not recorded cannot be reviewed or reversed. The log is how the owner checks what
    a Coach did without being asked.
  normative_text: |
    Each entry carries:
      * the time, the Coach's label (coach.naming.instance-label) and the repository;
      * the request, in one sentence;
      * the tier the action was placed in, and the reason, including any unclear fact resolved by
        coach.policy.unclear-risk-higher-tier;
      * the convention id that applies, or the standing approval it relies on;
      * the action taken, and the evidence (a link, a command, or a file path);
      * whether the action can be undone, and how.

    The log is in the place the Coach's brief names. It is not in a worker's session, and it is not
    replaced by a chat message.
  fix_hint: |
    Write the entry before the action, or in the same step. If the action failed, add a line saying so.
  exceptions:
  - >-
    Reading and searching do not need an entry unless they lead to an action.
metadata:
  severity: 2
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
