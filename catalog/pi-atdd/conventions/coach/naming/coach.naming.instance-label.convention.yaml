schema_version: 1.1.0
rule_id: coach.naming.instance-label
kind: policy
status: active
name: Name every Coach instance "Coach - <project or repo>"
statement: >-
  Every Coach instance is called "Coach - <project or repo>" in its window or tab label, its session
  title and the first line of every report it writes, so the owner can tell which repository a Coach
  serves.
content:
  summary: >-
    A Coach labelled only "Coach" is indistinguishable from other Coaches. The label carries the project
    or repository the Coach serves and is set at launch and kept on every report.
  normative_text: |
    The label has the form "Coach - " followed by the name of the project or repository the Coach
    serves, for example "Coach - pi-atdd". Use the repository's own name, not a role, a task or a
    branch.

    The label appears in three places: the window or tab label, the session title, and the first line
    of each report the Coach writes. A report that does not start with the label is a finding.

    A Coach that serves no single repository uses the Linear project named in its brief, in the same
    form: "Coach - <project>".
  fix_hint: |
    At launch, set the window or tab label and the session title to "Coach - <repo>". If a Coach was
    started with the bare label "Coach", rename its own tab, window and session title before it reports.
    Start the first report line with "Coach - <repo>".

    Do not:
      * leave the bare label "Coach" on any window, tab, session title or report;
      * name a Coach after another repository than the one it serves.
  exceptions:
  - >-
    A Coach session that has not yet been bound to a repository may show "Coach - (unbound)" until
    its brief names one; it must not serve work in that state.
metadata:
  severity: 2
  # strict: the label is checkable by a function (src/coach-policy.ts coachLabelViolation) when a label
  # string is available; the runtime launcher does not call it yet, so launch enforcement is text-only.
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
