schema_version: 1.1.0
rule_id: shared.handoff.record-contents
kind: policy
status: active
name: A context handoff record carries bounded facts, best-effort redacted task text, and states what is unknown
statement: >-
  A context handoff record MUST carry only bounded facts: the issue id, the workspace and revision,
  the usage at the threshold crossing, the task text with values under listed credential labels and token
  shapes redacted on a best-effort basis, and explicit `UNKNOWN` markers for anything not known. Redaction
  is list-based and is not general secret safety; it does not make a prompt safe to repeat. It MUST NOT copy the predecessor's own output, and it MUST
  NOT present any claimed completion as evidence. Its grant is stated by reference to the original brief.
  When the handing-off session is a Coach, the record MAY also carry an optional `Coach state` section under
  the same limits.
terms:
- term_id: handoff-record
  text: >-
    The text written when an agent session is handed to a fresh session so that the work can continue.
    It is read by a successor as a user message and is not itself a verdict.
content:
  summary: >-
    A successor needs the issue, the workspace, the task and an honest statement of what is unverified.
    Anything else copied into the record (assistant output, credentials pasted into a prompt) is carried
    into a new session and onto disk without review.
  normative_text: |
    The record names the issue (or `unknown`), the workspace, the revision (or `UNKNOWN`), the usage and
    the task. The task text is redacted on a best-effort basis: values under the listed credential labels
    (password, passphrase, secret, token, credential, auth, authorization, api key, private key and similar)
    and the listed provider token shapes. Labels or shapes not on the list pass unchanged. The workspace and
    record paths are recorded as written.
    The predecessor's done state is recorded as `not recorded`, and open items as `UNKNOWN`. The record
    states the grant by reference and says a handoff approves nothing. It says how to resume: re-verify
    the repository before relying on any claimed completion.

    When the handing-off session is a Coach, the record MAY also carry a `Coach state` section with: role,
    issues, workers, pull requests, attention items, owner decisions and next steps. Each field is taken from
    an authoritative source (the launch identity, the attention strip's open items, a tracker or pull request
    lookup); a field with no authoritative source is written `UNKNOWN`, never guessed. Tracker ids and pull
    request links that only appear in the task text are not an authoritative source: they may be listed
    separately as unverified task references, and never in the issues or pull requests fields.
    The section is redacted and bounded like the task text and never contains the predecessor's assistant
    output. It does not replace or relax any obligation above, and a record without it stays valid.
  fix_hint: |
    When writing a handoff record:
      * redact secret-shaped text before writing, not after;
      * write `UNKNOWN` where a field cannot be established, never a guess;
      * leave out the predecessor's assistant output;
      * bound the record's length and say when it was clipped;
      * in a Coach record, write `UNKNOWN` for a Coach state field that has no authoritative source, and keep ids mentioned in chat out of the issues and pull requests fields.

    Do not:
      * copy the last assistant message into the record;
      * record a revision or issue id derived from chat text when no authoritative source supplies it;
      * treat a handoff as a compliance verdict or as a grant.
  exceptions:
  - >-
    Task text that contains no listed label or token shape is recorded as written. Redaction is best-effort
    and list-based: it is not a substitute for keeping secrets out of prompts, and it is not general secret
    detection.
metadata:
  severity: 3
  disposition: strict
  introduced_in: 0.4.0
implementation:
  type: none
