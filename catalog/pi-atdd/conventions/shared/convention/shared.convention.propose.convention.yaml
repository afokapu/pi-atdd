schema_version: 1.1.0
rule_id: shared.convention.propose
kind: policy
status: active
name: Agents propose new or changed conventions through a governed path, never by editing active ones
statement: >-
  When an agent meets a situation no active convention covers, or an active convention that misfires,
  it records a convention proposal and continues its assigned work under the conventions that are
  active now. An agent never creates, edits, disables or deletes an active convention itself. A
  proposal carries concrete evidence, names the profile and area the rule belongs to, and is never
  applied to the task in which it was raised. Gaps found by experiments enter through the same path.
terms:
- term_id: convention_proposal
  text: >-
    A durable record with four parts: the situation the agent met, the evidence that the current
    conventions failed there, the proposed rule (new, or a change to a named existing convention), and
    the target profile and area. It is a request for review, not a rule.
- term_id: concrete_evidence
  text: >-
    An observed failure that a reader can check: a failed or returned review, a trap or acceptance
    the work missed, the same mistake repeated across tasks or agents, an existing convention that
    fired where it does not apply or stayed silent where it should apply, or a measured experiment
    gap. A preference, a style opinion or a hypothetical risk is not evidence.
- term_id: target_family
  text: >-
    The `<profile>.<area>` prefix the proposed rule would take. The profile is one of planner,
    tester, coder, reviewer, coach or shared; shared is used only when every profile must receive
    the rule.
- term_id: active_convention
  text: >-
    Any convention the agent's catalog currently loads, including its file, id, relationships and
    selectors.
content:
  summary: >-
    Agents suggest new rules or changes to existing rules as evidence-backed proposals; the coach
    collects them, an author drafts them in the convention format, an auditor checks them, and only
    the owner can approve one into the catalog.
  normative_text: |
    The catalog changes only through review. An agent that edits an active convention to suit its
    current task removes the guard the convention provides, and a rule written from preference
    rather than evidence adds noise that weaker models then follow. Routing every suggestion
    through one governed path keeps the catalog small, evidence-backed and owned.

    Proposal path:
      * the agent records the proposal (situation, evidence, proposed rule, target profile and area) where the coach collects proposals for the work;
      * the coach collects proposals and merges duplicates;
      * an author drafts the rule in the convention format and an independent auditor checks it;
      * the owner approves or declines it;
      * an approved rule is added as a new convention in its profile family; a declined proposal is recorded as declined, with the reason.
  fix_hint: |
    When the current conventions do not cover a situation, or one misfires:
      * first check whether an existing convention already covers it; prefer pointing to that convention over proposing a new one;
      * record a convention proposal with the situation, the concrete evidence, the proposed rule and its target profile and area;
      * for a change to an existing convention, name that convention's id and quote the part that misfired;
      * continue the assigned task under the conventions that are active now.

    Do not:
      * edit, rename, disable or delete an active convention, its relationships or its selectors;
      * apply the proposed rule to the current task, or treat it as approved before the owner approves it;
      * propose a rule from preference, style or a hypothetical risk without an observed failure;
      * file a proposal without a target profile and area.

    Experiments:
      * a gap measured in an experiment (for example a hard task where conventions did not close the gap to a stronger model) is filed as a proposal through this same path, with the run evidence attached.
  exceptions:
  - >-
    A task whose explicit, owner-approved purpose is to change the catalog (for example a convention
    rewrite or rename issue) edits conventions as its deliverable; it still goes through author,
    auditor and owner review before the change is active.
  - >-
    Reporting that an active convention could not be followed in the current task is not a proposal
    and is always allowed; the agent states the blocker in its report and continues or stops as the
    other active conventions require.
metadata:
  aliases:
  - CONVENTION-PROPOSAL-001
  severity: 3
  # strict: there is no detector; review enforces it (an edit to an active convention outside an
  # approved catalog task is a finding).
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
