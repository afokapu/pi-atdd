schema_version: 1.1.0
rule_id: shared.vocabulary.legacy-terms
kind: rule
status: active
name: Legacy railway terms migrate as whole units, through the mapping table, never one occurrence at a time
statement: >-
  A repository that still uses a legacy railway term (wagon, train, interlocking, Cargo, WMBT,
  Station Master) migrates it with the mapping table in conventions/legacy-terms.yaml. Prose in a file
  the agent is already editing takes the new term in the same commit. Identifiers (rule ids, paths,
  URN schemes, field keys, code names) migrate as a whole unit with the mechanical tool, because their
  references live in other files and other repositories. Until then the alias keeps the legacy name
  resolving. The vocabulary change is its own commit, and no file keeps both vocabularies after its unit
  is migrated. Advisory until the sunset date (60 days after the release that ships the change), then strict.
terms:
- term_id: legacy_term
  text: >-
    A term from the railway vocabulary that the mapping table replaces: wagon, train, interlocking,
    Cargo, WMBT, Station Master. The owner-approved replacements are product capability, user/system flow,
    flow router, flow variables, desired outcome and journey router.
- term_id: mapping_table
  text: >-
    conventions/legacy-terms.yaml: one legacy form maps to one new form per surface (prose, identifier,
    URN scheme, folder, field key). It is the only source for the migration tool, the aliases and agents.
- term_id: unit
  text: >-
    One capability, one plan folder, or the whole repository: the set of files whose references must change
    together.
content:
  summary: >-
    Legacy vocabulary is replaced through one mapping table, prose first, identifiers as whole units,
    aliases until the sunset date.
  normative_text: |
    The rename changes text only. Its proof is the mechanical check: every changed token is one pair from
    the table, and the change reverses exactly. A single occurrence renamed on its own breaks references
    that point at the old name, so identifiers move only as a unit. Owner-approved exceptions stay: the
    desired-outcome URN scheme, JourneyRunner, Flow (the companion tool), the SourceKind value flow, external
    domain names, and frozen audit records.
  fix_hint: |
    When you meet a legacy term:
      * prose and comments in a file you are already editing: replace it using the table, in the same commit;
      * identifiers: migrate the whole unit with the mechanical tool; until then, the alias keeps the old name resolving;
      * commit the vocabulary change alone, never mixed with a behaviour change;
      * do not leave one file with both vocabularies once its unit is migrated.
  exceptions:
  - >-
    Frozen records (audit pins, provenance, release notes) keep their recorded text.
  - >-
    Owner-approved exceptions: desired-outcome: (not outcome:), JourneyRunner, Flow, SourceKind "flow", wagons.dev.
metadata:
  aliases:
  - SHARED-VOCABULARY-LEGACY-TERMS-001
  severity: 2
  # advisory: a legacy term is a warning until the sunset date; the migration tool and review enforce the unit rule.
  disposition: advisory
  introduced_in: 0.2.1
implementation:
  type: review
  ref: legacy_terms_review
