schema_version: 1.1.0
rule_id: shared.tracker.unconfigured-notice
kind: rule
status: active
name: With no tracker configured, say so explicitly; never pass a code change silently
statement: >-
  With no tracker configured, a code change cannot be bound to a tracker issue: say so explicitly in the
  report and check result. Never report it as tracked, never pass it silently, never invent a tracker or id.
terms:
- term_id: unconfigured_tracker
  text: >-
    atdd-pi.yaml has no `tracker:` block, or it is incomplete. The workspace has not named a tracker, so
    no issue can be checked against it.
- term_id: explicit_notice
  text: >-
    A visible statement, in the report and in the validator output, that the change could not be checked
    against a tracker. It is a notice, not a failure of the agent and not a pass.
content:
  summary: >-
    A missing tracker configuration is reported, not hidden: the validator returns a notice and the agent
    names the gap in its report.
  normative_text: |
    The tracker is named by configuration. Where none is configured, the change set cannot be bound to an
    issue, and that gap must be visible: the validator returns a notice (exit code 3), the report says that
    no tracker is configured, and the owner decides whether to configure one. Silence would look like a pass.
  fix_hint: |
    Report "No issue tracker is configured; this change is not bound to a tracker issue". Ask the owner
    whether to configure one (atdd-pi.yaml `tracker: {kind, issuePattern}`).
metadata:
  aliases: []
  severity: 3
  disposition: strict
  introduced_in: PLT-96
implementation:
  type: validator
  ref: src/tracker-issue.ts::checkTrackerIssue
