schema_version: 1.1.0
rule_id: shared.tracker.issue-mandatory
kind: rule
status: active
name: Every code-changing task is bound to an issue in the configured tracker
statement: >-
  A code change (repository file, CI, deploy/infra or cloud build config) MUST be bound to an issue in
  the configured tracker before its first change. No issue: ask the owner, or create one only with approval.
  The issue id goes in the branch name and PR body; the issue stays current until the work is done.
terms:
- term_id: code_changing
  text: >-
    Any change to a repository file, a CI pipeline definition, deploy or infrastructure configuration,
    or cloud build settings. Documentation files are repository files and count. Read-only work does not.
- term_id: tracker_issue
  text: >-
    An issue in the tracker named by the workspace configuration (atdd-pi.yaml `tracker:`), the external
    record the owner sees. It is not the local ATDD issue record, which the planner binds separately.
- term_id: configured_tracker
  text: >-
    The tracker kind and issue id pattern come from configuration only. Nothing in the convention names
    a particular tracker product.
content:
  summary: >-
    Code changes are tracked in the external tracker: no code-changing task starts without an issue there,
    and the issue is kept current until the work is done.
  normative_text: |
    A repository, CI, deploy, infrastructure or cloud build change must have a tracker issue. The agent
    checks for one before the first change. When none exists it asks the owner, or creates one only with
    the owner's approval, because creating an issue is an external write. The issue id is then carried
    into the branch name and the pull request (see coder.tracker.issue-in-branch-and-pr). The work is not
    reported as complete while its tracker issue is still open.

    The obligation is checked by the tracker-issue validator (`atdd tracker check`) in CI and by the
    coordinator. The validator reads the changed files, the branch name and the PR body; it cannot read
    the tracker, so the status of the issue is a text obligation.
  fix_hint: |
    Before the first change: find the tracker issue (ask the owner if none). Put its id in the branch name
    and PR body. Keep its status current. Check with `atdd tracker check --changed <f> --branch <b> --pr-body-file <p>`.
  exceptions:
  - >-
    Read-only work needs no tracker issue.
metadata:
  aliases: []
  severity: 4
  # strict: the validator fails a change set with no tracker issue id in the branch and PR body. The
  # status of the issue itself is text-only (no tracker read in this package).
  disposition: strict
  introduced_in: PLT-96
implementation:
  type: validator
  ref: src/tracker-issue.ts::checkTrackerIssue
