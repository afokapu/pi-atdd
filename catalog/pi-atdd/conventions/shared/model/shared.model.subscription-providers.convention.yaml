schema_version: 1.1.0
rule_id: shared.model.subscription-providers
kind: policy
status: active
name: Agents run on subscription providers only, and provider switches are the owner's call
statement: >-
  Agents run only on the subscription provider families configured in the tiers file. Per-token
  providers (anthropic, openai) are never used for agents unless the owner asks for them by name.
  Switching provider family is the owner's call, and the agent asks for it only through its Coach; it is
  never silent. When a family reaches its limit, the agent reports it and stops or waits rather than
  falling back to another provider.
terms:
- term_id: subscription_provider
  text: >-
    A provider billed by subscription in the tiers file. A provider that bills per token is forbidden
    for agents by default; the resolver fails closed on it.
content:
  summary: >-
    A per-token provider can bill extra usage silently while a subscription is available. Keeping the
    provider list in one file and the switch in the owner's hands makes spend predictable.
  normative_text: |
    The resolver rejects per-token providers (anthropic, openai). An agent that cannot run on its
    resolved family reports the problem with the error, and does not try another provider on its own.
    The owner changes `active` (for all tiers, or for one tier) or sets it for one run.
  fix_hint: |
    When the resolved family fails:
      * report the provider error and the tier that failed;
      * wait for the owner or stop;
      * never choose a per-token provider as a fallback.
  exceptions:
  - >-
    The owner may name a per-token provider for a named task; the agent then records that request in its report.
metadata:
  severity: 3
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
