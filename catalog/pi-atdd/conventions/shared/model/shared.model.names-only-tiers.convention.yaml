schema_version: 1.1.0
rule_id: shared.model.names-only-tiers
kind: policy
status: active
name: Briefs and repository files name tiers, never models
statement: >-
  Briefs, rules, configs and repository files name a tier (`low`, `medium`, `high`, `xhigh`), never a
  model name, a model id or a hard-coded `--model` flag. The configured tiers file is the only place
  where a tier becomes a provider, model and thinking level.
terms:
- term_id: model_name
  text: >-
    Any provider model identifier or model family name, including a `--model` or `--provider` argument
    that carries one. Provider family ids in the tiers file are configuration, not model names.
content:
  summary: >-
    A brief that hard-codes a model is wrong the day the owner changes the subscription mapping, and it
    bypasses the tier rules. Naming tiers keeps briefs stable across provider switches.
  normative_text: |
    Briefs and repository files state the tier an agent needs and, where a launch is described, the
    helper command that resolves it. The mapping from tier to model lives only in the owner's tiers
    file; a repository file that names a model duplicates that decision and drifts from it.
  fix_hint: |
    Replace a model name with its tier, for example "run the worker on tier `low`", and let the
    helper resolve it. When a brief must reference a model that already exists in a log or report,
    quote it as evidence in a report, not as an instruction in a brief or rule.
  exceptions:
  - >-
    Measurement reports and experiment logs may record which model ran, as evidence of what happened.
metadata:
  severity: 3
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
