schema_version: 1.1.0
rule_id: shared.model.tier-by-role
kind: policy
status: active
name: Choose the model tier from the role, never ad hoc
statement: >-
  When an agent launches another agent or a worker, it chooses the model by tier from its role:
  planners, testers, coders and bounded-task operators run on `low`; coordinators and coaches run on `medium`, and
  `high` or `xhigh` are used only on an explicit owner request for a named task. The brief names the
  tier; the tiers file decides the provider, model and thinking level.
terms:
- term_id: tier
  text: >-
    One of `low`, `medium`, `high`, `xhigh`. A tier is a role-appropriate capability and cost level,
    not a model name; the configured tiers file maps it to a subscription provider, model and thinking.
- term_id: named_task
  text: >-
    The task identifier (for example a Linear issue) the owner names when requesting `high` or `xhigh`.
    A request without a named task is not an owner request.
content:
  summary: >-
    Agents that start sub-agents or workers pick models ad hoc and drift to the most expensive one.
    A role-to-tier rule plus one resolver makes the choice deterministic and reviewable.
  normative_text: |
    Role defaults:
      * planners, testers, coders and bounded-task operators: `low`;
      * coordinators and coaches: `medium`;
      * `high` and `xhigh`: only when the owner explicitly requests that tier for a named task.

    The agent resolves the tier through the toolkit helper (`model-tier-cli role <role>` or `resolve <tier>`)
    so that the provider, model and thinking come from the configured tiers file.
  fix_hint: |
    Before launching an agent:
      * name the role and take the tier from the table above;
      * resolve the tier with the helper and pass the printed arguments to the launcher;
      * record the tier, not the model, in the brief and in the report.

    Do not:
      * pick a model because it is the strongest one available;
      * raise a tier for a task the owner did not name;
      * use `high` or `xhigh` for a task where the owner has not asked for it.
  exceptions:
  - >-
    The PR reviewer keeps its own configured model; this rule does not choose a tier for it.
  - >-
    An explicit owner request for a named task overrides the role default for that task only.
metadata:
  severity: 3
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
