schema_version: 1.1.0
rule_id: shared.model.escalate-after-two-failures
kind: policy
status: active
name: Escalate one tier only after two reported failures
statement: >-
  A worker escalates one tier only after two failures on the same task, and only after reporting both
  failures with their evidence. Escalation is never silent. A step to `high` or `xhigh` still needs an
  explicit owner request for the named task.
terms:
- term_id: failure
  text: >-
    An attempt that does not meet the task's acceptance and is observed by a test, a review or a
    reviewer, with the evidence recorded. A provider or quota error is a provider failure, not a task failure.
content:
  summary: >-
    Cheap tiers should not be silently replaced by expensive ones. One reported step after two observed
    failures keeps escalation visible and bounded.
  normative_text: |
    The worker runs on its role tier. After the second failure on the same task it reports both
    failures (what was tried, what failed, the evidence) and proposes the next tier. The Coach decides escalation up to `medium`; `high` and
    `xhigh` are owner-only, on a named task. The step is then resolved through the helper with the reported tier. One step per two reported
    failures; never a silent jump.
  fix_hint: |
    On the second failure:
      * stop retrying on the same tier;
      * write the two failures with evidence into the task's report or tracker comment;
      * propose the next tier with the reason; do not switch models silently.

    Do not:
      * escalate on the first failure;
      * escalate silently;
      * step to `high` or `xhigh` without the owner's named-task request.
  exceptions:
  - >-
    A provider quota, outage or authentication error is reported as a provider problem under the
    subscription-provider rule; it is not a task failure and does not count toward escalation.
metadata:
  severity: 3
  disposition: strict
  introduced_in: 0.3.0
implementation:
  type: none
