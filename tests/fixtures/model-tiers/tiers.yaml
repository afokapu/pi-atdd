# Test fixture (PLT-97). Model ids are placeholders on purpose: the repository must not name real models.
active: claude
default: low
providers:
  claude: { provider: pi-claude-cli }
  codex:  { provider: openai-codex }
  kimi:   { provider: kimi-coding }
  glm:    { provider: zai }
tiers:
  low:
    claude: { model: fixture-low-claude, thinking: high }
    codex:  { model: fixture-low-codex, thinking: high }
    kimi:   { model: fixture-low-kimi, thinking: high }
    glm:    { model: fixture-low-glm, thinking: high }
  medium:
    claude: { model: fixture-medium-claude, thinking: medium }
    codex:  { model: fixture-medium-codex, thinking: medium }
    kimi:   { model: fixture-medium-kimi, thinking: medium }
    glm:    { model: fixture-medium-glm, thinking: medium }
  high:
    active: codex
    claude: { model: fixture-high-claude, thinking: medium }
    codex:  { model: fixture-high-codex, thinking: medium }
    kimi:   { model: fixture-high-kimi, thinking: high }
    glm:    { model: fixture-high-glm, thinking: high }
  xhigh:
    claude: { model: fixture-xhigh-claude, thinking: high }
    codex:  { model: fixture-xhigh-codex, thinking: high }
    kimi:   { model: fixture-xhigh-kimi, thinking: xhigh }
    glm:    { model: fixture-xhigh-glm, thinking: xhigh }
