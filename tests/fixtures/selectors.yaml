schema: pi-atdd/selectors/v1
selectors:
  - id: review-boundary
    operations: [task, edit, create]
    terms: ["review", "approve", "reconcile"]
    paths: ["src/**/review/*.ts", "src/review/*.ts"]
    rules:
      - atdd-bun.review.behavioral-reconciliation
  - id: coding-phase
    operations: [task, edit, create]
    terms: ["green", "refactor"]
    paths: ["src/**/application/*.ts", "src/application/*.ts"]
    rules:
      - coder.bun.phase-discipline
  - id: durable-collaboration
    operations: [task, edit, create]
    terms: ["agent communication", "handover", "delegation"]
    paths: ["src/**/messaging/*.ts"]
    rules:
      - atdd-flow.collaboration
  - id: integration-coordinator
    operations: [task, edit, create]
    terms: ["integration branch", "integration/", "coordinator", "jujutsu"]
    paths: ["src/**/workspace/*.ts"]
    rules:
      - atdd-workflow.workflow.lifecycle
