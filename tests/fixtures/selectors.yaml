schema: pi-atdd/selectors/v1
selectors:
  - id: python-auth-routes
    operations: [task, create, edit]
    paths: ["src/**/routes/*.py", "src/**/api/*.py", "src/routes/*.py"]
    terms: ["authentication", "authorization", "fastapi"]
    rules: [coder.security.missing-auth]
  - id: python-db-operations
    operations: [task, create, edit]
    paths: ["src/**/database/*.py", "src/**/repository/*.py", "src/database/*.py"]
    terms: ["n+1", "database queries", "orm"]
    rules: [coder.refactor.nplus1]
