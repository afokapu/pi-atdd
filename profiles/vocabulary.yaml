# Structure-profile key vocabulary (PLT-84).
#
# A structure profile is DATA, not rules. It tells a stack-neutral convention core where each role
# lives, how files and URNs are shaped, which idioms the stack uses and which tools enforce the rules.
# The vocabulary is CLOSED: a convention core may reference only keys listed here. A missing key is
# proposed through `proposedKeys` (see profiles/README.md) and enters this file only after the owner
# approves it. Bump `version` on every change.
#
# Key forms:
#   - plain keys, e.g. `roots.source`;
#   - parametric keys, e.g. `roles.<role>.path`, whose parameter must come from the group's `params`.
schema: pi-atdd/profile-vocabulary/v1
version: 3
status: v3 FROZEN (owner approved 2026-11-20 via Coach; digest pinned in profiles/vocabulary.lock.json). v3 adds map-typed keys, referenced as '<key>#<entry>'; generated from tools/neutral-fleet/consolidate_v3.py.
# v3 (2026-11-20, owner option 1 via Coach): 367 stage-2 proposals consolidated into 42 entries + 23 parameter values.
# v2 (2026-11-19, owner via coordinator, PLT-84 comment 12:22Z): + idiom.markup_kinds; roots.excluded = union.
issue: PLT-84
groups:
  roles:
    doc: Which architectural and artifact roles exist in the stack, what the stack calls them, and how a file is assigned to one.
    params:
      role: [domain, application, integration, presentation, boundary, composition_root, unit_test, acceptance_test, e2e_test, plan_artifact]
    keys:
      roles.layers:
        type: list
        doc: The stack's layer roles in dependency order, with their local names.
        example: "presentation, application, domain, integration"
      roles.assignment:
        type: text
        doc: How a file is assigned to a role, and whether a file with no role is in or out of scope.
        example: "the path's layer segment; a file with no layer segment is out of scope, not a violation"
      roles.<role>.name:
        type: text
        doc: The stack's local name for the role, when it differs from the role name.
        example: "composition_root -> assembly"
      roles.<role>.path:
        type: glob
        doc: Where files of the role live (a path segment or a glob relative to the source root).
        example: "domain -> **/domain/**"
      roles.<role>.kinds:
        type: list
        doc: The concrete artifact kinds that play the role.
        example: "boundary -> http-route, server-entry; plan_artifact -> wmbt_yaml"
      roles.layer_catalog: { type: map, doc: "Per-layer and per-side facts: layer responsibilities, layers per side, layers each harness exercises, component-type catalog and weights." }
      roles.runtime_components: { type: map, doc: "The plan-executing runtime components (dispatcher, journey/train/interlocking runners, route resolver, train executor): local names, entry points, locations." }
      roles.plan_hierarchy: { type: map, doc: "Plan decomposition levels, the unit of decomposition and its local names, containment fields." }
  roots:
    doc: Top-level trees of the repository, and the trees that are never scanned.
    keys:
      roots.config:
        type: path
        doc: The file in which the repository declares its roots and profile choices.
        example: "atdd-bun.yaml"
      roots.source:
        type: path
        doc: Root of production source.
        example: "topology.source_root, default src/wagons"
      roots.test:
        type: path
        doc: Root of unit and acceptance tests when they live outside the source tree.
      roots.e2e:
        type: path
        doc: Root of end-to-end tests.
      roots.plan:
        type: path
        doc: Root of plan artifacts.
        example: "topology.plan_root, default plan"
      roots.scan:
        type: text
        doc: Which roots a repository-wide check scans.
      roots.excluded:
        type: list
        doc: >-
          Vendored and generated trees that are never scanned. There is ONE list per stack. A rule whose
          checker owns the exact classification says so in its own verification, not here.
        example: "ATDD-Bun (owner decision): node_modules, .git, dist, build, _generated, plus repo-configured excludes"
      roots.docs: { type: path, doc: "Root of authored documentation." }
      roots.design_system: { type: path, doc: "Root(s) of the shared design system (primitives, tokens, components)." }
      roots.telemetry: { type: path, doc: "Root of the telemetry tracking plan and signal definitions." }
      roots.coordination: { type: path, doc: "Root of the durable workflow-coordination records." }
      roots.conventions: { type: path, doc: "Where the stack's convention documents and convention graph live." }
      roots.generated: { type: list, doc: "Generated output trees (documentation, renders, views) that are outputs, never authored inputs." }
  layout:
    doc: Directory shapes below the roots (wagon, feature, commons), and where each kind of artifact is placed.
    keys:
      layout.wagon_dir:
        type: pattern
        doc: Directory of one wagon (a bounded slice of the product).
      layout.feature_dir:
        type: pattern
        doc: Directory of one feature inside a wagon.
        example: "<source_root>/<wagon>/features/<feature>/"
      layout.commons_dir:
        type: pattern
        doc: Directory of code shared across features.
      layout.code_trees:
        type: list
        doc: The code trees to which layer rules apply.
        example: "commons and feature code"
      layout.plan_item:
        type: pattern
        doc: Path of one plan artifact (e.g. a WMBT) under the plan root.
        example: "<plan_root>/<wagon_dir>/<wmbt_id>.yaml"
      layout.test_location:
        type: pattern
        doc: Where a unit or acceptance test for a source file is placed.
      layout.e2e_location:
        type: pattern
        doc: Where an end-to-end test is placed.
      layout.locations: { type: map, doc: "Location (path segment, glob or pattern) of an artifact kind not covered by a dedicated layout key." }
      layout.registries: { type: map, doc: "Registry and index files that enumerate artifacts of a kind (decisions, contracts, trains, themes, subjects...)." }
      layout.schemas: { type: map, doc: "Locations of schemas that define artifact formats." }
      layout.contract_paths: { type: map, doc: "Contract tree layout: root, per-layout schema paths (flat, faceted, collection), catalog and contract-test locations." }
  suffix:
    doc: File-name suffixes and patterns that identify each file kind.
    params:
      file_kind: [source, unit_test, acceptance_test, e2e_test, markup, plan_artifact, config, test, test_exempt, contract, documentation, rejected_markup, telemetry_test, telemetry_signal, a11y_test, train, convention_node, coordination_record, declaration, barrel, placeholder, appendix, agent_instruction]
    keys:
      suffix.<file_kind>:
        type: list
        doc: Suffixes or name patterns of the file kind.
        example: "source -> .ts, .tsx"
  urn:
    doc: URN shapes, and the syntax by which a file declares or binds to one.
    params:
      artifact: [component, acceptance, smoke_acceptance, train, wmbt, wagon, feature, journey, test, telemetry, telemetry_item, contract, interlocking, participant, artifact]
    keys:
      urn.<artifact>:
        type: pattern
        doc: URN shape of the artifact.
        example: "acceptance -> acc:<domain>:<acceptance-id>"
      urn.binding.<artifact>:
        type: pattern
        doc: The syntax by which a source or test file binds itself to the artifact (header comment, decorator, annotation).
        example: "acceptance -> // Acceptance: acc:..."
      urn.declaration:
        type: pattern
        doc: How a plan artifact declares its own URN.
        example: "urn: \"wmbt:<wagon>:<wmbt_id>\""
      urn.test_kinds: { type: map, doc: "Test-identity URN shapes and kind segments per test kind (e2e, train e2e, journey smoke, responsive, telemetry), and harness-code maps." }
      urn.header: { type: map, doc: "Header fields and markers a file carries for traceability (identity, Tested-By, runtime, journey/train references)." }
      urn.grammar: { type: map, doc: "URN and identifier grammar not covered by a per-artifact key: separators, named parts, identity fields, reference shapes." }
      urn.builder: { type: map, doc: "Canonical constructs that build a URN for an artifact kind." }
  idiom:
    doc: The stack's concrete construct for a stack-neutral concept that a core refers to.
    keys:
      idiom.route_handler: { type: text, doc: "What a boundary handler (route, endpoint) looks like." }
      idiom.auth_guard: { type: text, doc: "How a handler establishes the authenticated principal." }
      idiom.error_types: { type: text, doc: "How domain and boundary errors are typed and raised." }
      idiom.validation_shape: { type: text, doc: "How request input is validated before use." }
      idiom.external_import: { type: text, doc: "How an import of an external package (outside the project graph) is recognised." }
      idiom.forbidden_runtime_imports: { type: list, doc: "Runtime, framework and transport import specifiers that inner roles must not import." }
      idiom.runtime_globals: { type: list, doc: "Runtime globals that count as framework machinery." }
      idiom.machinery: { type: text, doc: "What counts as delivery machinery (server, transport, runtime) in this stack." }
      idiom.dto_mapper_naming: { type: list, doc: "Name patterns of functions that map between DTOs and domain entities." }
      idiom.control_keywords: { type: list, doc: "Control-flow keywords that count toward nesting depth." }
      idiom.nesting_measure: { type: text, doc: "How nesting depth is measured in the stack's syntax." }
      idiom.destructive_request: { type: text, doc: "The declarative markup construct that issues a destructive request." }
      idiom.mutation_requests: { type: list, doc: "Declarative markup constructs that issue non-destructive mutating requests." }
      idiom.confirmation_gate: { type: text, doc: "The declarative construct that asks the user to confirm before a request." }
      idiom.prompt_gate: { type: text, doc: "The declarative construct that asks the user for input before a request." }
      idiom.declaration_scope: { type: text, doc: "Where a gate must be declared relative to the request construct." }
      idiom.comment_marker: { type: text, doc: "Line-comment syntax of the stack's source files." }
      idiom.markup_kinds: { type: list, doc: "Artifact kinds (static pages, templates, server-rendered output) that count as markup in which declarative request and gate constructs can appear.", example: "html, htmx template, server-rendered markup" }
      idiom.plan_syntax: { type: map, doc: "Constructs of plan artifacts (produce/consume, routes, trains, ownership, status, references, sessions)." }
      idiom.acceptance_schema: { type: map, doc: "The acceptance-artifact schema: precondition fields, trigger shapes, assertion kinds, harness templates and codes, telemetry decision." }
      idiom.docs_syntax: { type: map, doc: "Documentation constructs: identity, status and lifecycle, relationships, internal references, generated regions, decision-record headers." }
      idiom.convention_graph: { type: map, doc: "Convention-graph constructs: node id fields, operative fields, anchors, edge endpoints, rule-binding files." }
      idiom.routing: { type: map, doc: "Composition-root routing constructs: action-to-route maps, route tables, journey maps and registries, start and launch surfaces." }
      idiom.test_constructs: { type: map, doc: "Test-code constructs: test case and context, assertions and matchers, substitutions, phase and RED markers, fixtures, browser measurements." }
      idiom.responsive: { type: map, doc: "Responsive styling: breakpoints, viewports, width conditions and declarations, length units, styling contexts and notations." }
      idiom.design_system: { type: map, doc: "Design-system constructs: token definition and reference, raw colour literals, component exports, barrels, interactive controls, renderers." }
      idiom.markup: { type: map, doc: "Declarative markup constructs beyond the dedicated idiom keys: request and swap constructs, progress signals, event handlers, ids, interpolation." }
      idiom.telemetry: { type: map, doc: "Telemetry constructs: emit calls, event shapes, vendor SDKs, observation tiers and channels." }
      idiom.logging: { type: map, doc: "Logging constructs: logger receivers, structured logger, context shape, ad-hoc print calls, CLI output." }
      idiom.security: { type: map, doc: "Security-relevant constructs: SQL sinks and parameterisation, authorization checks, environment access, error-response payloads." }
      idiom.module_boundaries: { type: map, doc: "Module and runtime boundary constructs: imports, outbound I/O calls, servers, collaborators, composition domains, structural roots." }
      idiom.dto_shape: { type: map, doc: "How a DTO is declared, named and kept pure." }
      idiom.naming: { type: map, doc: "Naming constructs: verb lexicon, name-token separators." }
      idiom.source_syntax: { type: map, doc: "Source-syntax facts used by checks: comment-line kinds, complexity measure, runtime-declaration header and values." }
      idiom.collaboration: { type: map, doc: "Collaboration-toolchain idioms: seat addresses, integration branches, delegation context, model portfolio, file-reading tool." }
  enforcement:
    doc: >-
      Stack-wide facts about how conventions are enforced. Per-rule severity and disposition are NOT
      profile keys: they belong to the rule (core verification).
    keys:
      enforcement.runner:
        type: text
        doc: The command or tool that runs the stack's convention checks.
        example: "atdd-bun"
      enforcement.default_disposition:
        type: text
        doc: The disposition of a rule that does not declare one.
      enforcement.suppression_marker:
        type: pattern
        doc: Syntax of a time-boxed suppression of one rule.
        example: "# atdd:suppress(<rule_id>) UNTIL=YYYY-MM-DD"
      enforcement.report_location:
        type: pattern
        doc: How a finding reports its location.
        example: "<path>:<line>"
      enforcement.exceptions: { type: map, doc: "Where and how intentional exceptions are declared (allow-lists, coverage exceptions, naming exceptions)." }
      enforcement.presets: { type: map, doc: "Profile presets per kind of work and the location of each profile's registry." }
  tooling:
    doc: Package manager, languages, test runner and helper commands of the stack.
    keys:
      tooling.languages: { type: list, doc: "Languages of production source.", example: "typescript, javascript" }
      tooling.package_manager: { type: text, doc: "The package manager that owns dependencies.", example: "Bun" }
      tooling.install_command: { type: text, doc: "How a dependency is added." }
      tooling.manifest: { type: path, doc: "The dependency manifest file.", example: "package.json" }
      tooling.lockfile.native: { type: list, doc: "Lockfile(s) owned by the package manager.", example: "bun.lock, bun.lockb" }
      tooling.lockfile.foreign: { type: list, doc: "Lockfiles of other package managers that must not coexist with the native one." }
      tooling.foreign_install_commands: { type: list, doc: "Install commands of other package managers." }
      tooling.workspace_declaration: { type: text, doc: "How the workspace declares its package manager." }
      tooling.test_runner: { type: text, doc: "The stack's test runner." }
      tooling.urn_resolver: { type: text, doc: "The command that resolves a URN to its artifact." }
      tooling.commands: { type: map, doc: "Helper commands of the stack's toolchain (authoring, plan session, generators, renderers, seat lifecycle, cleanup)." }
      tooling.language_scopes: { type: map, doc: "Languages per check scope (scanned code, test files, in-scope files)." }
      tooling.test_harness: { type: map, doc: "The declared test harness, foreign harnesses that must not be used, and runtime families of tests." }
      tooling.typecheck: { type: map, doc: "Typecheck configuration, checker dependencies, no-emit commands, step names and strictness options." }
      tooling.stack_signals: { type: list, doc: "Markers by which a repository or package is recognised as this stack." }
      tooling.appendix_formats: { type: map, doc: "Appendix types, their file formats, and which formats the agent tooling can read." }
# These stay with the rule, never in a profile.
notProfileKeys:
  - "per-rule severity and disposition -> core verification"
  - "detector, validator and finding ids of a single rule -> the stack realization (bunOnly); core verification names the check generically"
  - "rule-specific concepts of a stack -> an entry of a map key ('<key>#<entry>'), never a new key"
  - "rule-specific examples and task terms -> core activation (neutral) or the realization"
