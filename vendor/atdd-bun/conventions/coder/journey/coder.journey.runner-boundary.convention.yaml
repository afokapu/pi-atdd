schema_version: 1.1.0
rule_id: coder.journey.runner-boundary
kind: rule
status: active
name: JourneyRunner composes flow routers without executing user/system flows or product capabilities (Bun)
statement: >-
  A Bun consumer that declares one or more journey topology documents under plan/_journeys/ MUST ship
  a JourneyRunner under src/user-system-flows/**. JourneyRunner is the continuation-control layer above
  FlowRouterRunner: it MUST read and parse the declared journey topology, MUST reference
  FlowRouterRunner for routing decisions, MUST NOT construct a FlowRouterRunner from a hardcoded
  literal path, and MUST NOT bypass
  that boundary by referencing FlowRunner directly, importing product capability modules, calling runUserSystemFlow(...),
  looping over user-system-flow.sequence as an executor, or carrying/mutating flow variables. FlowRouterRunner continues
  to select exactly one user/system flow and delegate that user/system flow to FlowRunner; JourneyRunner only decides which
  flow router is entered next according to the declared journey topology.
implementation:
  type: validator
  ref: coder.bun.journey-runner-boundary
content:
  summary: >-
    Enforces the Bun runtime boundary introduced by planner journey topology. Presence of
    plan/_journeys/**/*.yaml enables the obligation. The family detector looks for class
    JourneyRunner under src/user-system-flows/**, requires evidence that the runtime reads and parses a journey
    declaration, requires it to reference FlowRouterRunner, rejects literal FlowRouterRunner
    construction, and rejects direct FlowRunner/capability/FlowVariables execution patterns.
  normative_text: |
    The intended call model is:

        Journey router
          -> JourneyRunner
               -> FlowRouterRunner.resolve/execute(...)
                    -> FlowRunner.execute(selectedUserSystemFlowId, ...)
               -> inspect declared continuation/terminal
               -> next FlowRouterRunner ...

    JourneyRunner owns continuation control, never the user/system flow step loop. FlowRouterRunner owns local
    route selection, never cross-flow-router topology. FlowRunner remains the only capability-step executor.
  fix_hint: |
    Add a JourneyRunner under src/user-system-flows/ that reads the supplied journey declaration and delegates
    each routing decision to FlowRouterRunner using declaration-derived values. Remove literal
    FlowRouterRunner paths, direct FlowRunner calls, product capability imports, flow-variable handling, runUserSystemFlow(...)
    calls, and user-system-flow.sequence executor loops from JourneyRunner.
  exceptions:
    - Consumers with no plan/_journeys topology carry no JourneyRunner obligation.
    - Consumers with no journey router composition root yet (a repository in the PLAN stage) carry no
      JourneyRunner obligation, as coder.bun.flow-router-runner-exists owes no FlowRouterRunner before one.
metadata:
  aliases:
    - BUN-JOURNEY-RUNNER-BOUNDARY-001
  severity: 4
  disposition: strict
  introduced_in: 0.1.0
terms:
  - term_id: journey_runner
    text: the runtime continuation-control layer that traverses declared journey topology between flow routers.
  - term_id: boundary
    text: JourneyRunner -> FlowRouterRunner -> FlowRunner; each layer owns only its declared responsibility.
