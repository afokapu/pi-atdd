schema_version: 1.1.0
rule_id: coder.journey-router.journey-routing
kind: rule
status: active
name: Journey router reaches exposed journey topology through JourneyRunner (Bun)
statement: >-
  Every journey document with entrypoint.exposed=true MUST be reachable from the Bun journey router
  composition root. Each declared entrypoint action MUST appear in server.ts JOURNEY_MAP as a
  {journeyId, path} mapping to that journey document, and the journey router MUST reference
  JourneyRunner. Internal journeys (entrypoint.exposed=false) carry no journey router reachability
  obligation. This closes the public entry direction for the higher-order journey topology without
  weakening the existing direct-user/system-flow or direct-flow-router mappings.
implementation:
  type: validator
  ref: coder.bun.journey-router-journey-routing
content:
  summary: >-
    Binds journey declaration -> journey router reachability -> JourneyRunner. It reads
    plan/_journeys/**/*.yaml, selects exposed journeys, and verifies that each declared action maps
    to the same journey_id/path in JOURNEY_MAP and that server.ts references JourneyRunner.
  normative_text: |
    The journey router admits three additive route forms:

        action -> "user-system-flow:<subject>:<slug>"
        action -> { flowRouterId, path }
        action -> { journeyId, path: "plan/_journeys/<id>.yaml" }

    For a journey route the call boundary is:

        Journey router -> JourneyRunner(journeyPath) -> FlowRouterRunner -> FlowRunner

    The journey document is authoritative for continuation topology. JOURNEY_MAP only establishes
    external reachability; it must not restate continuation edges.
  fix_hint: |
    For every exposed journey action, add a JOURNEY_MAP entry whose journeyId and path point to the
    declared journey document and dispatch it through JourneyRunner.
  exceptions:
    - Journeys with entrypoint.exposed:false are intentionally not journey-router-reachable.
    - Consumers with no journey router composition root yet (a repository in the PLAN stage) carry no
      reachability obligation, as for exposed flow routers.
metadata:
  aliases:
    - BUN-JOURNEY_ROUTER-JOURNEY-ROUTING-001
  severity: 4
  disposition: strict
  introduced_in: 0.1.0
terms:
  - term_id: journey_reachability
    text: the declaration-to-composition-root binding that makes an exposed journey executable.
  - term_id: journey_mapping
    text: a journey router JOURNEY_MAP value carrying journeyId and the canonical journey YAML path.
