schema_version: 1.1.0
rule_id: coder.green-urn.capability-feature
kind: rule
status: active
name: URN product capability and feature segments are kebab-case identifiers
statement: >-
  The `{capability}` and `{feature}` segments of a URN MUST match `^[a-z][a-z0-9-]*$`. Stack-neutral
  obligation, Bun-specific detector; realized by `bun_green_traceability_detector` (core alias GREEN-
  URN-003).
terms:
- term_id: kebab_identifier
  text: >-
    `^[a-z][a-z0-9-]*$` — the plan's own grammar for product capability and feature names.
- term_id: silent_join_failure
  text: >-
    the state where a header reads correctly to a human but binds to nothing, because a case- or
    separator-sensitive key did not match.
content:
  summary: >-
    A "URN identifiers are kebab-case" obligation. The detector applies the pattern to segments 1 and 2 of
    a well-formed six-segment URN, naming whichever fail.
  normative_text: |
    Product capability and feature are join keys into `plan/`, and a join key that is case- or separator-sensitive fails silently: `Orders` and `orders` are two different product capabilities to a string match, so a header with the wrong casing binds to nothing while reading correctly to a human. Kebab-case is the plan's own grammar, so the header must use it exactly.
  fix_hint: |
    Canonical path:
      * use the exact plan product capability and feature identifiers in lowercase kebab-case.
    
    During GREEN:
      * derive both values from the feature currently being implemented,
      * normalize only casing or separators when the identity is already correct,
      * keep the component name, side, and layer untouched.
    
    Do not broaden:
      * do not invent or rename plan capabilities/features to satisfy the source header,
      * do not copy identifiers from a neighboring feature without checking ownership.
    
    Prove:
      * the current behavioral acceptance passes,
      * product capability and feature segments match the plan's canonical identifiers.
  exceptions:
  - URNs that are not six well-formed segments are skipped (owned by `green-urn-pattern`).
  - The name, side and layer segments are governed by their own rules.
metadata:
  aliases:
  # GREEN-URN-003 is the SHARED core alias — the same one carried by the Python
  # realization and by coder.vite.green-urn-capability-feature. One obligation, three
  # per-stack detectors, found through this alias.
  - GREEN-URN-003
  - BUN-GREEN-URN-CAPABILITY-FEATURE-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_green_traceability_detector
