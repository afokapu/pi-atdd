schema_version: 1.1.0
rule_id: tester.e2e.user-system-flow-e2e-coverage
kind: rule
status: active
name: Every declared user/system flow has a browser spec
statement: Every human-facing user/system flow declared under `plan/` (one in which a `user:` participant takes part) MUST
  have at least one journey spec bound to it by `// UserSystemFlow:`. Bun/htmx realization of `tester.vite.user-system-flow-e2e-coverage`,
  strict.
terms:
- term_id: browser_spec
  text: 'a `*.e2e.ts` file run by Playwright, or any test file whose header comments carry a journey marker (`//
    User/system flow:`, `// Journey:`, `// URN: test:user-system-flow:…`, `// URN: test:journey:…`), so a misnamed one is still judged.
    A unit test that merely mentions a journey URN in a string is not one.'
content:
  summary: Every declared user/system flow has a browser spec.
  normative_text: |
    A user/system flow with no browser spec is a silent gap: the journey it declares can regress with nothing turning red.
    The `// UserSystemFlow:` binding is the detector's coverage handle, not the proof itself. A meaningful browser spec starts from the declared user-facing entrypoint, performs the interactions that make the user/system flow relevant, and asserts the user-observable business outcome the journey promises. A spec that only binds the user/system flow, navigates successfully, or mentions its identifier can satisfy structural coverage while leaving the journey behavior unproven.
  fix_hint: |
    Add `e2e/<user-system-flow-slug>.e2e.ts` bound with `// UserSystemFlow: <userSystemFlow id>`, then make that spec prove the user/system flow rather than merely name it.

    Claim:
      * read the declared user-system-flow/journey behavior and identify the user-observable outcome it is meant to deliver.

    Stimulus:
      * enter through the declared user-facing entrypoint,
      * perform the real browser interactions that exercise the user/system flow.

    Witness:
      * assert the final user-visible business outcome, not only navigation, a 200 response, or an internal state token.

    Avoid:
      * adding the user/system flow header solely for coverage credit,
      * calling an internal handler instead of walking the assembled journey,
      * seeding the final result directly,
      * asserting only that the page loaded while the user/system flow behavior itself remains unobserved.

    Verify:
      * the spec would turn red if the user/system flow's user-facing behavior regressed.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
  - The rule reports at the user/system flow's plan file, where the gap was declared.
  - User/system flows in which no person takes part (only product capabilities and systems) have no screen to drive and are out of scope.
metadata:
  aliases:
  - BUN-E2E-USER_SYSTEM_FLOW-E2E-COVERAGE-001
  severity: 3
  disposition: strict
  introduced_in: 0.5.0
  mirrors: tester.vite.user-system-flow-e2e-coverage
implementation:
  type: validator
  ref: htmx_e2e_detector
