schema_version: 1.1.0
rule_id: tester.e2e.covered-user-system-flow-is-routed
kind: rule
status: active
name: A user/system flow a browser spec covers is selected by a flow router route
statement: A declared user/system flow that a journey spec binds to MUST be selected by at least one flow router route. Bun/htmx
  realization of `tester.vite.covered-user-system-flow-is-routed`, strict.
terms:
- term_id: browser_spec
  text: 'a `*.e2e.ts` file run by Playwright, or any test file whose header comments carry a journey marker (`//
    User/system flow:`, `// Journey:`, `// URN: test:user-system-flow:…`, `// URN: test:journey:…`), so a misnamed one is still judged.
    A unit test that merely mentions a journey URN in a string is not one.'
content:
  summary: A user/system flow a browser spec covers is selected by a flow router route.
  normative_text: A spec can stay green while exercising a user/system flow nothing in the application can reach. Covering
    an unrouted user/system flow proves nothing about the product.
  fix_hint: Route the user/system flow from a flow router, or bind the spec to a routed user/system flow.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
  - Undeclared user/system flows are reported by `tester.htmx.e2e-binds-declared-subject`.
metadata:
  aliases:
  - BUN-E2E-COVERED-USER_SYSTEM_FLOW-IS-ROUTED-001
  severity: 3
  disposition: strict
  introduced_in: 0.5.0
  mirrors: tester.vite.covered-user-system-flow-is-routed
implementation:
  type: validator
  ref: htmx_e2e_detector
