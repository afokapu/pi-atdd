schema_version: 1.1.0
rule_id: tester.flow-router.user-system-flow-sequence-is-exercised
kind: rule
# DRAFT, and the word is load-bearing. The obligation is authored and its validator
# exists and is tested, but it is realized by `scan_execution()` which the gated
# `scan_root()` deliberately does not call. Shipping it `active` would claim an
# enforcement that never runs — a rule that says it checks and does not. It becomes
# `active` in the same change that wires the check into the gate.
status: active
name: Some test exercises the product capability sequence each declared user/system flow actually runs
statement: >-
  Every user/system flow reachable from a declared flow router route MUST have a test that asserts the product capability
  SEQUENCE it executes — the ordered steps, not merely which user/system flow was selected. Route resolution
  and trace binding both prove WHICH user/system flow was chosen; neither proves WHAT it ran. Without this a
  user/system flow definition can be reordered, shortened or emptied and the suite stays green.
terms:
- term_id: capability_sequence
  text: >-
    the ordered `sequence:` of a user/system flow definition, and the ordered steps a FlowRunner reports
    having executed. The obligation is that a test compares the two, in order.
- term_id: selection_is_not_execution
  text: >-
    `route-coverage` proves an admissible route is exercised; `trace-binds-declared-route` proves
    the run is attributable to its declared route. Both are statements about SELECTION. A user/system flow
    whose sequence is wrong is selected correctly and runs the wrong thing.
content:
  summary: >-
    The tester half of `coder.user-system-flow.runtime-executes-the-declaration (python; the Bun coder half is not yet authored)`. That rule makes the runtime
    READ the plan. This one makes the suite prove it OBEYS it — the two are worth nothing apart.
  normative_text: |
    THE PAIRING IS THE POINT. A runtime that reads the plan but is never tested against it can
    still drift: the plan is edited, the runtime dutifully executes the new sequence, and no test
    notices because none ever asserted what ran. A suite that asserts a sequence against a runtime
    that hardcodes it proves only that the hardcoding is self-consistent. Both halves are needed
    before "the user/system flow YAML is the source of truth" is a checkable claim rather than a slogan.

    Demonstrated rather than argued: on a consumer whose FlowRunner genuinely loads the user/system flow
    definition, replacing a user/system flow's whole `sequence:` in the plan left its suite green. The
    runtime had changed behaviour completely; the tests were looking somewhere else.
  fix_hint: |
    Assert the executed order against the declaration, in order:

      def test_standard_user_system_flow_runs_its_declared_sequence():
          trace = new FlowRunner(res.userSystemFlowPath).execute(res.userSystemFlowId, {})
          declared = [s["capability"] for s in yaml.safe_load(Path(path).read_text())["sequence"]]
          assert trace["steps"] == declared

    Reading the expected order FROM the plan rather than restating it as literals is what makes
    the test track the declaration instead of a copy of it.
  exceptions:
  - A consumer that declares no flow router route space carries no obligation.
  - A user/system flow reachable by no declared route is out of scope; this rule follows the route space.
metadata:
  aliases:
  - BUN-TESTER-USER_SYSTEM_FLOW-SEQUENCE-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
  core_design_refs:
  - afokapu/atdd#1248
  - afokapu/atdd#1251
implementation:
  type: validator
  ref: tester.bun.flow-router-user-system-flow-sequence-is-exercised
