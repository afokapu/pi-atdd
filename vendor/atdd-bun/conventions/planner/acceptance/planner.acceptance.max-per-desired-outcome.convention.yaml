schema_version: 1.1.0
rule_id: planner.acceptance.max-per-desired-outcome
kind: constraint
status: active
name: Acceptance cap per DESIRED OUTCOME
statement: Keep acceptances <=5 per DESIRED OUTCOME; if more are needed, split the DESIRED OUTCOME into clearer outcomes.
source:
  legacy_path: src/atdd/planner/conventions/acceptance.convention.yaml
  legacy_section: max_per_desired_outcome + guidelines + expected_ratios
  legacy_sha: 027e2d86ff127550
  extraction_mode: high_fidelity
content:
  constraints:
  - 'max_per_desired_outcome: 5'
  - acceptance_to_test ratio 1:1 (one acceptance -> one test)
  - test_to_component ratio N:1
  operational_guidance: 'Each acceptance maps to exactly one metric_id (no mixed measures). Respect DESIRED OUTCOME
    rules: one dimension and one lens_ref per DESIRED OUTCOME; acceptances inherit context from the parent DESIRED OUTCOME.'
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: false
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: acceptance_cap
  text: the per-desired-outcome ceiling on acceptances.
  values:
    max: 5
