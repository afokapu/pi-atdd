schema_version: 1.0.0
rule_id: planner.capability.name-is-verb-object
kind: rule
status: active
name: Product capability name is verb-object
statement: A product capability slug must be verb-object — kebab-case, at least two tokens, the
  leading token a verb from the convention verb lexicon, and no connective tokens.
  Brand or proper-noun slugs must be listed explicitly in capability.convention.yaml
  verb_object_enforcement.brand_exceptions; an implicit exception is a violation.
terms:
- term_id: capability_verb_object
  text: the verb-object naming rule for a product capability slug
  values:
    lexicon_source: conventions:planner:feature#/artifact_seeds/verb_selection
    examples_ok:
    - resolve-dilemmas
    - manage-users
    - route-request
    - preview-changes
    - respond-event
    examples_bad:
    - mode-select
    - blitz
implementation:
  type: validator
  ref: test_capability_name_is_verb_object::test_confirm_blocks_non_verb_object_capability
metadata:
  severity: 3
  disposition: strict
validation:
  family: format
  template: naming_pattern
  variant: planner_capability_name_is_verb_object
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: product capability
  failure_evidence:
  - capability_slug
  - reason
