schema_version: 1.1.0
rule_id: planner.capability.no-consume-cycle
kind: constraint
status: active
name: No cross-capability produce/consume cycle
statement: The directed product capability graph built from produce->consume artifact NAMES must be acyclic; no strongly-connected component may span more than one product capability.
implementation:
  type: validator
  ref: conventions/acyclicity/test_no_cross_capability_consume_cycle::test_fault_injection_convention_catches
source:
  legacy_path: docs/recompose
  legacy_section: complexity-sizing
  extraction_mode: summary
content:
  normative_text: 'Build a directed graph whose nodes are product capabilities and whose edges go producer-capability -> consumer-capability whenever an artifact NAME produced by one product capability is consumed by another product capability. Run strongly-connected-component analysis; any SCC containing more than one product capability is a cross-capability dependency cycle and a violation. The graph is keyed on artifact name, never on the contract field (contract is nullable corpus-wide).'
  constraints:
  - the cross-capability produce/consume graph is a DAG
  - edges are keyed on the produce/consume artifact name, not the nullable contract field
metadata:
  severity: 3
  disposition: strict
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-18'
terms:
- term_id: consume_cycle
  text: a strongly-connected component of the directed product capability produce/consume graph whose size exceeds one product capability.
