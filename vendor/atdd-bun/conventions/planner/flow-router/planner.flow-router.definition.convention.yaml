schema_version: 1.1.0
rule_id: planner.flow-router.definition
kind: family
status: draft
name: Flow router — advisory semantic anchor
statement: A flow router is the domain-decomposition artifact for a diverging journey
  — it declares WHICH user/system flow is selected next when a journey branches, keyed by a produced
  artifact (the divergence signal), composing multiple strictly-linear user/system flows into a
  branching journey-of-journeys. It is a declared routing registry (artifact_urn ->
  user_system_flow_id), not an imperative map. This names the routing DECISION; the runtime that
  resolves and executes it (the route-control runner and its dispatcher) is a coder/tester
  concern. This node is an advisory semantic anchor — it enforces nothing directly;
  the enforceable parts of this meaning are decomposed into the constraint/rule nodes
  that require it.
terms:
- term_id: semantic_anchor
  label: Advisory semantic anchor
  text: a definitional node that gives the artifact a stable meaning but is not itself
    bound to a validator; it is transitively protected by the enforceable constraint/rule
    nodes that require it.
- term_id: flow router
  label: Flow router
  text: flow router -> {routing-decision, artifact-keyed, declared-registry, user-system-flow-composing}.
  values:
    routing-decision: selects the next user/system flow when a journey diverges, rather than branching
      inside a user/system flow (user/system flows stay linear, see planner.user-system-flow.linearity).
    artifact-keyed: dispatch is keyed by a produced artifact URN; a composite (urn,
      discriminant) key is exceptional (see planner.user-system-flow.dispatch-map-is-registry,
      planner.user-system-flow.dispatch-composite-key-exceptional).
    declared-registry: the dispatch map is a declared, schema-valid registry the domain
      owns, not code.
    user-system-flow-composing: sequences multiple linear user/system flows into a branching journey-of-journeys.
  note: Enforcers for the runtime realization (route-control runner exists / delegates
    execution / carries no flow variables / bilateral binding) live in the coder+tester layer
    (atdd.extension.coder.user-system-flow-flow-router and atdd.extension.tester.user-system-flow-flow-router) and are related to this domain anchor
    by cross-persona traceability, tracked as a separate follow-up, not authored here.
