schema_version: 1.0.0
rule_id: planner.journey.definition
kind: family
status: active
name: Journey topology — composition above flow routers
statement: >-
  A journey is the declarative topology that composes routing decisions across flow routers.
  Flow routers remain local decision boundaries: each selects exactly one linear user/system flow. An exposed
  journey declares the journey router actions that start it and its first flow router. The journey
  owns what happens AFTER that selected user/system flow completes: a route may terminate explicitly, or a named
  artifact produced by the selected user/system flow may continue control at another flow router. A journey
  therefore composes flow router -> user/system flow -> flow router without making flow routers recursive and
  without moving product capability execution out of FlowRunner.
terms:
  - term_id: journey
    label: Journey topology
    text: journey -> {station-entrypoint, entrypoint-flow-router, route-continuations, explicit-terminals}.
  - term_id: station_entrypoint
    text: >-
      exposed journeys declare journey router actions and consumer surfaces; Bun binds those actions
      to {journeyId, path} through coder.bun.journey-router-journey-routing.
  - term_id: continuation
    text: >-
      a binding from one (flow_router_id, route_id) pair, through an artifact produced by that
      route's selected user/system flow, to the next flow router.
  - term_id: terminal
    text: an explicit declaration that a route ends the journey rather than continuing to another flow router.
  - term_id: ownership_boundary
    text: >-
      Flow router owns user/system flow selection; FlowRunner owns linear product capability execution; Journey owns
      continuation between routing decisions. None of the three absorbs the others.
notes: >-
  The canonical document shape is planner-schemas/journey.schema.json. Journey artifacts are planner
  data; a Bun runtime realization may introduce a JourneyRunner, but runtime execution is deliberately
  separate from this semantic definition.
metadata:
  severity: 3
  disposition: advisory
  introduced_in: 0.1.0
