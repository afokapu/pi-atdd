schema_version: 1.0.0
rule_id: planner.journey.flow-router-composed
kind: constraint
status: active
name: Every flow router is composed into a journey
statement: >-
  A plan that declares flow routers must declare at least one journey, and every flow router must be
  reached by a journey: either as a journey's entrypoint flow router or as the destination of a
  continuation reachable from that entrypoint. A flow router no journey reaches is a routing decision
  with no stated trigger and no stated place in the product flow.
rationale: >-
  planner.journey.continuation-closure validates the journeys a plan declares, so a plan that declares
  none, or leaves some flow routers outside every journey, passes it vacuously. The journey is where
  the plan says what starts a routing decision and what happens after its user/system flow completes; without
  this rule a decomposition can stop at flow routers and look complete while the end-to-end flow was
  never decided.
terms:
  - term_id: composed_flow_router
    text: >-
      a flow router that is the entrypoint of at least one journey, or the destination of a
      continuation reachable from a journey's entrypoint.
  - term_id: vacuous_topology
    text: >-
      a plan with flow routers and no journey. Every flow router is reported, because none of them is
      composed.
implementation:
  type: validator
  ref: planner.static.validators.bun::journeyCompositionFindings
metadata:
  severity: 4
  disposition: strict
  introduced_in: 0.4.0
validation:
  family: closure
  template: graph_route_space_closure
  variant: planner_journey_composition
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: flow router
  failure_evidence:
    - flow_router_id
    - journey_count
    - reason
