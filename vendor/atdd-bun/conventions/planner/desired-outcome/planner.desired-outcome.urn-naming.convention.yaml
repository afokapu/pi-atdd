schema_version: 1.1.0
rule_id: planner.desired-outcome.urn-naming
kind: rule
status: active
name: DESIRED OUTCOME URN naming
statement: A DESIRED OUTCOME URN is desired-outcome:{capability}:{STEP_CODE}{NNN} — a unique step-coded identifier built via URNBuilder.desiredOutcome(capability_id,
  sequence).
source:
  legacy_path: src/atdd/planner/conventions/desired-outcome.convention.yaml
  legacy_section: urn_naming
  legacy_sha: 040256ed5588a6c7
  extraction_mode: high_fidelity
content:
  normative_text: product capability = parent product capability (kebab-case); STEP_CODE = single step letter; NNN = three-digit
    zero-padded sequence (001-999).
  examples:
  - desired-outcome:resolve-dilemmas:E001
  - desired-outcome:burn-timebank:M045
  - desired-outcome:user-mgmt:C023
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: false
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: desired_outcome_urn
  text: the DESIRED OUTCOME identifier.
  values:
    pattern: ^desired-outcome:[a-z][a-z0-9-]*:[DLPCEMYRK][0-9]{3}$
    sequence_range: 001-999
