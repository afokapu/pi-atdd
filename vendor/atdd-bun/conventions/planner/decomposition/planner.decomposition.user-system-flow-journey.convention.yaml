schema_version: 1.0.0
rule_id: planner.decomposition.user-system-flow-journey
kind: pattern
status: active
statement: 'After product capabilities and DESIRED OUTCOMES are kept, decode the journey: the nominal user/system flow
  (the main-job journey) plus operator keep/pivot/kill on error, alternate, and exception
  sibling user/system flows. Absorbs the retired PLAN-3B (#940).'
terms:
- term_id: nominal_user_system_flow
  text: the happy-path journey realizing the main job.
- term_id: sibling_user_system_flows
  text: error/alternate/exception journeys decided by keep/pivot/kill alongside the
    nominal user/system flow.
