schema_version: 1.1.0
rule_id: planner.integrity.user-system-flow-capability-resolves
kind: rule
status: active
name: User/system flow product capabilities resolve
statement: Every product capability a user/system flow lists under `capabilities:` is declared as `capability:<slug>`. Package rule, strict.
terms:
- term_id: package_rule
  text: 'a rule of this package''s own gates (`atdd-bun.*`), realized by a package guard rather than a canonical
    planner node. It is held to the same per-rule checks as every convention: a convention, strict, a failing fixture,
    relationship edges.'
content:
  summary: User/system flow product capabilities resolve.
  normative_text: A user/system flow ordering a product capability that does not exist cannot run.
  fix_hint: Declare the product capability, or remove it from the user/system flow.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
metadata:
  aliases:
  - ATDD-BUN-PLANNER-USER_SYSTEM_FLOW-CAPABILITY-RESOLVES
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: planner_plan_integrity
