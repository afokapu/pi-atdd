schema_version: 1.0.0
rule_id: planner.plan.confirm-requires-flow-router-sanity
kind: policy
status: active
name: Confirm requires flow router sanity
statement: Ratify cannot lock a user/system-flow-bearing plan when required flow router sanity
  fails.
terms:
- term_id: confirm_gate
  text: Ratify refuses to lock a user/system-flow-bearing plan when required flow router sanity
    fails, and a failure leaves the session unlocked
implementation:
  type: validator
  ref: test_confirm_flow_router_sanity::test_confirm_requires_flow_router_sanity
metadata:
  severity: 4
  disposition: strict
validation:
  family: presence
  template: conditional_requirement
  variant: planner_plan_confirm_requires_flow_router_sanity
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: plan-session
  failure_evidence:
  - session_id
  - user_system_flow_id
  - flow_router_id
  - route_id
  - failed_rule
