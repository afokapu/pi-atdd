schema_version: 1.0.0
rule_id: planner.user-system-flow.flow-router-route-category-matches-user-system-flow-id
kind: constraint
status: active
name: Flow router route category matches user/system flow id
statement: Every flow router route declares nominal/error/alternate/exception and
  that category must equal the `category` field of the target user/system flow it selects
  (issue #1421 — category is a validated field, not an identity digit).
terms:
- term_id: category_field_agreement
  text: route.category must equal the target user/system flow's `category` field (nominal/error/alternate/exception);
    the legacy identity digit is retired and no longer parsed
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_flow_router_route_category_matches_user_system_flow_id
metadata:
  severity: 4
  disposition: strict
validation:
  family: coherence
  template: resolved_fact_agreement
  variant: planner_user_system_flow_flow_router_route_category_matches_user_system_flow_id
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: flow router
  failure_evidence:
  - flow_router_id
  - route_id
  - category
  - user_system_flow_id
  - user_system_flow_category
  - user_system_flow_path
