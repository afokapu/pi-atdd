schema_version: 1.1.0
rule_id: planner.user-system-flow.terminal-contract
kind: principle
status: draft
name: User/system flow terminal contract
statement: A user/system flow's terminal step declares exactly one primary artifact. That terminal contract is the source of truth for the user/system flow's family - if it requires an Acceptance Authority commit and terminates in platform:acceptance:commit-receipt the user/system flow is delivery, otherwise it is behavior.
terms:
- term_id: terminal_contract
  label: Terminal contract
  text: the declared primary artifact of a user/system flow's final step; family (behavior|delivery) is derived from it, never from the user/system flow id.
