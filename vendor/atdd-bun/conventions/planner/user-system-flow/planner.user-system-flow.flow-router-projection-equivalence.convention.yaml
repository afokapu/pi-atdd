terms:
- term_id: projection_equivalence
  text: the referenced user/system flow sequence equals the route projection by step, intent,
    from, to, and artifact
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_user_system_flow_sequence_matches_flow_router_projection
metadata:
  severity: 4
  disposition: strict
validation:
  family: coherence
  template: resolved_fact_agreement
  variant: planner_user_system_flow_flow_router_projection_equivalence
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: flow router
  failure_evidence:
  - flow_router_id
  - route_id
  - user_system_flow_id
  - step
  - field
  - expected
  - actual
