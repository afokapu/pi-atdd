schema_version: 1.1.0
rule_id: planner.user-system-flow.initial-flow-variables-inputs-declared
kind: rule
status: draft
name: Initial flow-variable inputs declared
statement: A user/system flow MUST declare every artifact flow variables may be seeded with - inputs.caller (caller-provided) and inputs.spec_materialized (deterministically materialized from the spec). Undeclared or missing required initial inputs are rejected before step 1. Pending binding - validator owned by D2 (#1086).
terms:
- term_id: initial_inputs
  label: Declared initial inputs
  text: inputs.{caller, spec_materialized}; seeded into flow variables and validated before the first product capability step.
