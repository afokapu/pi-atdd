schema_version: 1.1.0
rule_id: planner.user-system-flow.dependencies
kind: rule
status: active
name: User/system flow dependencies
statement: A user/system flow references prerequisite user/system flows as user-system-flow:{user_system_flow_id}; foundation (commons) user/system flows often
  precede others; data-flow consumers depend on producers; circular dependencies are forbidden.
source:
  legacy_path: src/atdd/planner/conventions/user-system-flow.convention.yaml
  legacy_section: dependencies
  legacy_sha: 825602729f11a3a4
  extraction_mode: high_fidelity
content:
  examples:
  - user-system-flow:00-auth-session before user-system-flow:30-match-solo (foundation_first)
  - user-system-flow:30-match-solo depends on user-system-flow:21-scenario-curation (data_flow)
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: false
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: dependency
  text: a prerequisite user/system flow reference.
  values:
    pattern: ^user-system-flow:[0-9]{2}-[a-z][a-z0-9-]*$
    circular: forbidden
