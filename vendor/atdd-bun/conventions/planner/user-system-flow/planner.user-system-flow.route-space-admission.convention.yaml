schema_version: 1.0.0
rule_id: planner.user-system-flow.route-space-admission
kind: constraint
status: active
name: Route-space admission
statement: 'Every registered user/system flow must be targeted by exactly one registered flow router
  route, or declare a typed single-route assessment; absence of a route no longer
  implies direct dispatch (issue #1554).'
rationale: Route-space was modelled as optional metadata, so a user/system flow with no route
  analysis was indistinguishable from a user/system flow whose analysis concluded single-route.
  Silence read as a positive assertion that analysis happened; this rule makes the
  classification explicit and forces the omission to surface at planning time.
terms:
- term_id: route_targeted
  text: the user/system flow is selected by exactly one route across every registered flow router
- term_id: typed_single_route
  text: the user/system flow declares route_space.classification single-route with a basis drawn
    from a closed vocabulary; free prose is never a basis
- term_id: exactly_one
  text: route-targeted and typed-single-route are mutually exclusive; declaring both
    is a contradiction, declaring neither is an omission
implementation:
  type: validator
  ref: test_route_space_admission::test_every_user_system_flow_is_route_targeted_or_typed_single_route
metadata:
  severity: 4
  disposition: strict
validation:
  family: coverage
  template: source_has_required_target
  variant: planner_user_system_flow_route_space_admission
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: user/system flow
  failure_evidence:
  - user_system_flow_id
  - user_system_flow_path
  - route_ids
  - classification
  - basis
  - admission_status
