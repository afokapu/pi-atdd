schema_version: 1.1.0
rule_id: planner.user-system-flow.registry
kind: rule
status: active
name: User/system flow registry (two-file pattern)
statement: 'Each user/system flow needs two files: a registry entry in plan/_user_system_flows.yaml and a full spec at plan/_user_system_flows/{user_system_flow_id}.yaml;
  every registry entry MUST have a corresponding spec file.'
implementation:
  type: validator
  ref: conventions/resolution/test_user_system_flow_validation::test_fault_injection_and_legacy_parity
source:
  legacy_path: src/atdd/planner/conventions/user-system-flow.convention.yaml
  legacy_section: registry
  legacy_sha: 825602729f11a3a4
  extraction_mode: high_fidelity
content:
  normative_text: Registry is theme-category-grouped (nominal/error/alternate/exception). Validator SPEC-USER_SYSTEM_FLOW-VAL-0003;
    planner phase gate fails if a spec file is missing.
  examples:
  - 'registry: plan/_user_system_flows.yaml (user_system_flow_id, description, path, product capabilities summary)'
  - 'spec: plan/_user_system_flows/{user_system_flow_id}.yaml (full workflow)'
metadata:
  severity: 3
  # strict: the planner phase gate fails when a registry entry has no spec file
  # (content.normative_text / SPEC-USER_SYSTEM_FLOW-VAL-0003). Backfilled to complete this
  # single-node authoring so the disposition gate manages it (#1225).
  disposition: strict
parity:
  source_fragments_preserved: true
  examples_preserved: true
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: two_file_pattern
  text: registry entry + spec file per user/system flow.
  values:
    registry: plan/_user_system_flows.yaml
    spec: plan/_user_system_flows/{user_system_flow_id}.yaml
