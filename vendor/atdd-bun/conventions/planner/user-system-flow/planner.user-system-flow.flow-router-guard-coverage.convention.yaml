schema_version: 1.0.0
rule_id: planner.user-system-flow.flow-router-guard-coverage
kind: constraint
status: active
name: Flow router guard coverage
statement: Every executable guard path in a flow router maps to exactly one user/system flow
  route, unless explicitly classified as structural residual.
terms:
- term_id: guard_coverage
  text: each executable guard path maps to exactly one route, or is explicitly classified
    as a structural residual
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_every_executable_guard_projects_to_user_system_flow
metadata:
  severity: 4
  disposition: strict
validation:
  family: coverage
  template: projection_covers_source
  variant: planner_user_system_flow_flow_router_guard_coverage
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: flow router
  failure_evidence:
  - flow_router_id
  - guard_id
  - route_id
  - coverage_status
