schema_version: 1.0.0
rule_id: planner.user-system-flow.flow-router-entrypoint-shape
kind: rule
status: active
name: Flow router entrypoint shape
statement: Every flow router declares whether it is runtime-exposed and which Station
  Master actions are expected to reach it.
terms:
- term_id: entrypoint_shape
  text: exposed:true requires actions>=1; exposed:false requires reason; actions are
    Journey router action names not user/system flow IDs; planner validates shape only
implementation:
  type: validator
  ref: test_sequence_diagram_sanity::test_flow_router_entrypoint_shape_valid
metadata:
  severity: 3
  disposition: strict
validation:
  family: schema
  template: required_field_presence
  variant: planner_user_system_flow_flow_router_entrypoint_shape
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: flow router
  failure_evidence:
  - flow_router_id
  - exposed
  - actions
  - reason
  - field_path
