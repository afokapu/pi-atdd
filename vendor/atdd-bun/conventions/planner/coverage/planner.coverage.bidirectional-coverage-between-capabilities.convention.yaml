schema_version: 1.1.0
rule_id: planner.coverage.bidirectional-coverage-between-capabilities
kind: rule
status: active
name: Product capability - Feature Coverage
statement: A product capability and its features must reference each other bidirectionally (feature->product capability and product capability->feature).
source:
  legacy_path: src/atdd/planner/conventions/coverage.convention.yaml
  legacy_section: rules
  legacy_sha: 27e800378c584902
  extraction_mode: high_fidelity
  legacy_rule_id: planner.coverage.bidirectional-coverage-between-capabilities
bidirectional:
- direction: feature -> product capability
  requirement: Every feature file must be referenced by its product capability manifest
  exceptions: features_orphaned allow-list
  validator: test_all_features_in_capability_manifest
- direction: product capability -> feature
  requirement: Every features[] entry must have corresponding YAML file
  validator: test_all_capability_feature_refs_exist
metadata:
  aliases:
  - COVERAGE-PLAN-2.2
  disposition: documentation-only
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: capability_feature_coverage
  text: each feature is referenced by its product capability and vice versa.
