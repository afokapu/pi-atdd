schema_version: 1.1.0
rule_id: planner.coverage.bidirectional-coverage-between-user-system-flows
kind: rule
status: active
name: User/system flow - product capability Coverage
statement: A user/system flow and its product capabilities must reference each other bidirectionally (product capability->user/system flow and user/system flow->product capability).
source:
  legacy_path: src/atdd/planner/conventions/coverage.convention.yaml
  legacy_section: rules
  legacy_sha: 27e800378c584902
  extraction_mode: high_fidelity
  legacy_rule_id: planner.coverage.bidirectional-coverage-between-user-system-flows
bidirectional:
- direction: product capability -> user/system flow
  requirement: Every product capability must appear in at least one user/system flow's participants
  exceptions: capabilities_not_in_user_system_flow allow-list or status:draft
  validator: test_all_capabilities_in_at_least_one_user_system_flow
- direction: user/system flow -> product capability
  requirement: 'Every product capability: participant must have a product capability manifest'
  validator: test_all_user_system_flow_capability_refs_exist
metadata:
  aliases:
  - COVERAGE-PLAN-2.1
  disposition: documentation-only
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: bidirectional_coverage
  text: each side references the other, no orphan.
