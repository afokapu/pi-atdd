schema: pi-atdd/selectors/v1
# Selectors name roles (domain, application, boundary, unit_test, ...), never paths, where a stack layout is involved;
# the active structure profile (profiles/stacks/<stack>.json) maps roles to paths. Path selectors below are
# about this toolkit's own workflow files, not a stack layout.
# The bundled registry is intentionally incomplete; unmatched work is an explicit
# applicability gap, not a pass or exemption. Extend through project selectors.
selectors:
  - id: review-reconciliation
    operations: [task, edit, create, review]
    terms: ["review", "approve", "reconcile", "merge readiness"]
    paths: ["src/**/review/*.ts", "src/**/review/**/*.ts", "src/reviews.ts"]
    rules: [reviewer.reconciliation.behavioral]
  - id: lifecycle-phase
    operations: [task, edit, create]
    terms: ["green", "red", "refactor", "implement acceptance"]
    roles: [application, domain]
    rules: [coder.phase.discipline]
  - id: protected-routes
    operations: [task, edit, create]
    terms: ["authorization", "authentication", "route", "endpoint"]
    roles: [boundary]
    rules: [coder.security.missing-auth]
  - id: architecture-boundaries
    operations: [task, edit, create]
    terms: ["architecture", "dependency direction", "layer boundary", "imports"]
    roles: [domain, integration, presentation]
    rules: [coder.architecture.hierarchy-import]
  - id: acceptance-bindings
    operations: [task, edit, create]
    terms: ["acceptance", "traceability", "test binding", "coverage"]
    roles: [unit_test, e2e_test]
    rules: [tester.acceptance.binding-declared]
  - id: integration-coordinator
    operations: [task, edit, create, review]
    terms: ["integration branch", "integration/", "coordinator", "jujutsu", "worktree"]
    paths: ["src/**/workspace/*.ts", "src/**/vcs.ts"]
    rules: [coach.workflow.lifecycle]
  - id: model-tier-choice
    operations: [task, edit, create]
    terms: ["sub-agent", "subagent", "launch agent", "launch an agent", "spawn agent", "spawn an agent", "agent brief", "worker brief", "model tier", "model tiers", "choose the model", "pick the model", "model choice"]
    paths: ["**/briefs/**", "**/model-tier*.ts", "**/model-tiers*.yaml"]
    rules: [shared.model.tier-by-role, shared.model.names-only-tiers, shared.model.escalate-after-two-failures, shared.model.subscription-providers]
  - id: durable-delivery
    operations: [task, edit, create]
    terms: ["agent communication", "handover", "delegation", "inbox", "message delivery"]
    paths: ["src/**/messaging/*.ts", "src/**/runtime-state.ts", "src/**/threads.ts"]
    rules: [coach.collaboration.accountable-delegation]
  - id: coach-instance-label
    operations: [task, edit, create, review]
    terms: ["coach instance", "coach launch", "coach window", "coach tab", "coach session", "instance label"]
    rules: [coach.naming.instance-label]
  - id: coach-action-tiers
    operations: [task, edit, create, review]
    terms: ["merge without owner", "merge without the owner", "owner approval", "ask the owner", "act alone", "decision log", "shared install", "tier escalation", "spending"]
    rules: [coach.policy.action-tiers, coach.policy.unclear-risk-higher-tier, coach.policy.trivial-request, coach.policy.decision-log]
  - id: coach-role-no-build
    operations: [task, edit, create, review]
    terms: ["coach edits", "coach builds", "coach implements", "code PR", "edit repo code", "open a code PR"]
    rules: [coach.role.orchestrate-not-build]
  - id: convention-proposal
    operations: [task, edit, create, review]
    terms: ["convention proposal", "propose a convention", "new convention", "misfiring convention", "uncovered situation", "convention gap"]
    rules: [shared.convention.propose]
  # PLT-96 (review P1): the tracker obligation reaches code-changing work. Task wording is broad on purpose:
  # a false match only adds guidance, a missed match hides the obligation. A write to any repository file
  # (docs, CI and infra files included) is code-changing by definition, so edit/create are always in scope.
  # The no-tracker notice is selected with the obligation, so a missing tracker is said wherever it applies.
  # Applicability gaps for non-code task wording still surface (status unresolved; tested).
  - id: tracker-code-change
    operations: [task]
    terms: ["implement", "fix", "change", "update", "add", "refactor", "commit", "push", "pull request", "merge request", "branch", "deploy", "release", "pipeline", "terraform", "cloud build", "infrastructure", "code change", "build", "create", "make", "write", "ship", "remove", "delete", "rename", "migrate", "set up", "setup", "install", "configure", "wire", "introduce", "replace", "rewrite", "patch", "edit", "modify", "scaffold", "feature", "page", "screen", "dashboard", "endpoint", "route", "ci", "workflow", "docker", "helm", "kubernetes", "bug", "hotfix"]
    rules: [shared.tracker.issue-mandatory, shared.tracker.unconfigured-notice]
  - id: tracker-code-write
    operations: [edit, create]
    always: true
    rules: [shared.tracker.issue-mandatory, shared.tracker.unconfigured-notice]
  # PLT-103 review (P2): the advisory legacy-vocabulary convention is active as a warning. Legacy wording in a task or
  # review selects it. An edit or create selects it when the file carries a legacy name (the selector cannot read the
  # content; the migration tool does). Paths outside these names keep the v0.2.0 activation (activation probe, N-004).
  - id: legacy-vocabulary-task
    operations: [task, review]
    terms: ["wagon", "wagons", "train", "trains", "interlocking", "interlockings", "cargo", "wmbt", "wmbts", "station master", "station masters", "legacy term", "legacy vocabulary", "vocabulary rename"]
    rules: [shared.vocabulary.legacy-terms]
  - id: legacy-vocabulary-edit
    operations: [edit, create]
    paths: ["**/*wagon*", "**/*wagon*/**", "**/*train*", "**/*train*/**", "**/*interlocking*", "**/*interlocking*/**", "**/*cargo*", "**/*wmbt*", "**/*wmbt*/**", "**/*station-master*", "**/*station_master*", "**/*legacy-terms*"]
    rules: [shared.vocabulary.legacy-terms]
  - id: tracker-branch-and-pr
    operations: [task]
    terms: ["pull request", "pr", "branch", "push", "merge request"]
    rules: [coder.tracker.issue-in-branch-and-pr]
  - id: tracker-ratify-binding
    operations: [task]
    terms: ["ratify", "decomposition", "confirm"]
    rules: [planner.tracker.issue-before-ratify]
  - id: context-handoff
    operations: [task, edit, create, review]
    terms: ["handoff", "context handoff", "context usage", "new session", "session switch", "compaction"]
    paths: ["src/context-handoff.ts", "src/pi-activation.ts", "extensions/atdd.ts", "tests/context-handoff*.test.ts"]
    rules: [shared.handoff.record-contents, shared.handoff.bounded-chain]
