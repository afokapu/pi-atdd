schema: pi-atdd/pointers/v1
# ATD-45: at edit and create, a location rule is delivered as one imperative line plus its source and digest, so a write
# with several fresh rules fits one page. The full text is delivered to the reviewer and stays in the canonical file.
# Location and header rules only; judgment rules keep their full text. Each instruction must contain the path pattern its convention states (tests/render-pointers.test.ts checks this).
pointers:
  shared.topology.plan-location: "Declare the capability at <plan_root>/<capability>/_<capability>.yaml, each feature at <plan_root>/<capability>/<feature>.yaml and each DESIRED OUTCOME at <plan_root>/<capability>/<DESIRED_OUTCOME>.yaml; move the file there if it is elsewhere."
  shared.topology.source-location: "Place this source file under <source_root>/<capability>/features/<feature>/ for a feature the plan declares, and add the component:{capability}:{feature}:{name}:{frontend|backend}:{domain|application|integration|presentation} URN header."
  tester.topology.test-location: "Place this test under <test_root>/<capability>/features/<feature>/{unit,contract,integration}/ and add the URN: test:{capability}:{feature}:{acceptance} and Acceptance: acc:{capability}:{acceptance} headers."
  tester.topology.e2e-location: "Place flow router tests at <e2e_root>/flow-routers/<flow-router>/<route>.routes.test.ts and journey tests at <e2e_root>/journeys/<journey>.journey.test.ts, each with a test: URN and an Acceptance: header. A frontend journey may instead be a browser spec (*.e2e.ts) bound by UserSystemFlow: or Journey:, not by an Acceptance: header."
  planner.capability.features: "List every feature module of the capability and its current status in <plan_root>/<capability>/_features.yaml."
  tester.test.carries-urn-identity: "Add a header comment above the imports of every test file: // URN: test:{capability}:{feature}:{ACCEPTANCE-ID} (the test: scheme, above the first line of code)."
