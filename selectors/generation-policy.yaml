schema: pi-atdd/selector-generation/v1
# Input for src/selector-generation.ts. Selectors in selectors/generated.yaml are derived from the activation facts
# every neutral convention declares (core.activation.facts, observability observable_now). Nothing here names a rule.
#
# Delivery tiers (ATD-45). A rule delivered at every edit costs context on each file, so:
#   edit_rules - exactly these rules are delivered at edit, create and review;
#   every other generated rule is delivered at review only (the independent reviewer gets the full set).
# The coverage rules are not listed on purpose: their activation facts name plan, test, source and config files alike,
# so delivering them at every edit would put four topology rules in front of every source change.
edit_rules:
  - shared.topology.plan-location
  - shared.topology.source-location
  - tester.topology.test-location
  - tester.topology.e2e-location

# file_kind values the neutral conventions mark needs_new_observer although the structure profile already observes them
# (it resolves the role to the plan root). Only these values are taken from a needs_new_observer fact.
profile_observed_kinds:
  - plan_artifact

# Neutral convention operation names mapped onto the operations Pi delivers at (task, edit, create, review).
# An operation not listed here is reported as unmapped, never dropped silently.
operations:
  create: create
  author: create
  edit: edit
  modify: edit
  review: review

# file_kind / role values mapped to where they live. A value matches when its lower-cased form with spaces turned into
# underscores equals an entry in `values`, or starts with an entry in `prefixes`. `roles` and `roots` resolve through the
# active structure profile (never a stack path in this file); `paths` are explicit globs. A value that matches no entry is listed in the generation report.
file_kinds:
  - values: [plan_artifact, plan, acceptance, acceptance_artifact, desired_outcome, feature, feature_plan,
             feature_artifact, feature_definition, feature_file, user/system_flow, user/system_flow_definition,
             user/system_flow_registry_entry, flow_router, journey, capability_manifest,
             product_capability_manifest, product_capability, product_capability_plan]
    roots: [plan]
  - values: [source]
    prefixes: ["source_file"]
    roots: [source]
  - values: [test, unit_test, acceptance_test]
    roles: [unit_test]
  - values: [e2e_test]
    roles: [e2e_test]
